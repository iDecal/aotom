 {p:'Vi sinh có thể góp phần cải thiện hệ vi khuẩn trong ao, nhưng không thay cho sục khí, kiểm soát thức ăn và loại bỏ bùn. Hiệu quả thực tế phụ thuộc chủng vi sinh, điều kiện nước và chất lượng chế phẩm.'},
 {h:'Phân biệt nhóm vi sinh'},
 {table:[['Nhóm','Vai trò thường được ứng dụng','Lưu ý'],['Bacillus spp.','Hỗ trợ phân hủy chất hữu cơ, cạnh tranh sinh thái với vi khuẩn không mong muốn','Không phải thuốc chữa bệnh; cần đủ oxy để phân hủy hiếu khí.'],['Vi khuẩn nitrat hóa','Chuyển hóa amoni thành nitrit rồi nitrat trong chu trình nitơ','Hoạt động phụ thuộc oxy, pH và kiềm; không xử lý tức thì khi NH3 tăng.'],['Vi sinh hỗ trợ đường ruột','Một số chủng được bổ sung qua thức ăn để hỗ trợ cân bằng hệ vi khuẩn tiêu hóa','Chủng, liều và hiệu quả theo đúng sản phẩm; không dùng thay điều trị.']]},
 {h:'Các bước trước khi sử dụng'},
 {ul:['Kiểm tra DO, pH, kiềm, nhiệt độ; nếu oxy thấp, ưu tiên xử lý thiếu oxy trước.', 'Đọc nhãn để xác định chủng, mật độ vi sinh, hạn dùng, điều kiện bảo quản và cách dùng cho ao hoặc trộn thức ăn.', 'Duy trì cho ăn vừa đủ và quản lý bùn đáy: bổ sung vi sinh không giải quyết được nguồn hữu cơ quá tải.', 'Theo dõi DO, NH3/TAN, NO2 và sức ăn trước, sau khi áp dụng; ghi nhật ký để đánh giá hiệu quả thay vì chỉ dựa vào màu nước.', 'Không tự tăng liều hoặc phối trộn nhiều chế phẩm; không dùng ngay sát thời điểm sát trùng nếu hướng dẫn nhà sản xuất không cho phép.']},
 {h:'Lưu ý quan trọng'},
 {ul:['Các báo cáo khoa học có kết quả không đồng nhất về hiệu quả giảm chất thải của chế phẩm vi sinh. Không có chế phẩm nào bảo đảm xử lý được tất cả khí độc, Vibrio hoặc bệnh tôm.', 'Không tự ủ vi sinh bằng đường, mật rỉ hoặc nguyên liệu không có quy trình kiểm soát, vì có thể gây tiêu hao oxy và làm biến động nước.', 'Khi tôm nổi đầu, chết nhanh hoặc giảm ăn bất thường, kiểm tra môi trường và liên hệ kỹ thuật viên; không chỉ tạt vi sinh rồi chờ.']}]},
{id:'visinhnuoc',ic:'water',t:'Vi sinh xử lý nước & đáy ao',s:'Chất hữu cơ, bùn đáy và chu trình nitơ',src:['VS','VB','GN'],blocks:[
 {p:'Bùn đáy, phân tôm và thức ăn dư làm tăng nhu cầu oxy và giải phóng các dạng nitơ. Vi sinh hoạt động trong một hệ thống có đủ oxy và môi trường thích hợp; bản thân việc bổ sung chế phẩm không bảo đảm chất lượng nước.'},
 {h:'Quy trình theo dõi thực tế'},
 {ul:['Đo oxy sáng sớm, pH sáng và chiều; theo dõi NH3/TAN, NO2 và độ kiềm theo lịch phù hợp mật độ nuôi.', 'Giảm thức ăn dư theo sàng; hút bùn hoặc gom chất thải đúng cách nếu hạ tầng ao cho phép.', 'Tăng hoặc duy trì sục khí, nhất là đêm và rạng sáng; tránh khuấy bùn đột ngột gây thoát khí độc.', 'Nếu dùng chế phẩm, chọn loại được phép lưu hành và sử dụng đúng nhãn; ghi ngày dùng và so sánh xu hướng chỉ tiêu nước.', 'Nếu NH3 hoặc nitrit tăng kéo dài, kiểm tra khối lượng cho ăn, oxy, pH, kiềm và khả năng xử lý nước; không kỳ vọng vi sinh tác động tức thì.']},
 {h:'Không nên'},
 {ul:['Không đổ hóa chất sát trùng trực tiếp vào ao đang cần giữ quần thể vi sinh có lợi mà không có đánh giá kỹ thuật.', 'Không trộn bừa vi sinh với kháng sinh hoặc chất diệt khuẩn.', 'Không tin rằng nước trong hay hết mùi là bằng chứng NH3 và NO2 đã an toàn: cần đo bằng bộ thử phù hợp.']}]},
{id:'visinhduongruot',ic:'feed',t:'Vi sinh đường ruột & thức ăn',s:'Men tiêu hóa, bảo quản và theo dõi sức ăn',src:['FP','AAP','FAO'],blocks:[
 {p:'Một số chế phẩm lợi khuẩn được thiết kế để trộn cùng thức ăn, hướng tới hỗ trợ tiêu hóa hoặc cân bằng hệ vi sinh. Hiệu quả phụ thuộc chủng vi khuẩn và điều kiện nuôi, không thể suy ra chỉ từ tên “men vi sinh”.'},
 {ul:['Chọn sản phẩm ghi rõ chủng vi sinh, hàm lượng, liều dùng và quy định bảo quản.', 'Trộn theo hướng dẫn nhãn; hạn chế nhiệt độ hoặc cách pha có thể làm giảm vi khuẩn sống.', 'Quan sát lượng ăn trên sàng, tình trạng phân, đường ruột và tăng trưởng; ghi chép các thay đổi theo thời gian.', 'Nếu tôm có biểu hiện phân trắng, gan tụy bất thường, bỏ ăn hoặc chết rải rác, kiểm tra nguyên nhân bệnh và môi trường; vi sinh đường ruột không thay xét nghiệm hoặc điều trị có chuyên môn.', 'Không tự phối trộn kháng sinh hoặc chất sát khuẩn với men vi sinh.']},
 {h:'Điểm cần nhớ'},
 {ul:['Đảm bảo chất lượng thức ăn, khẩu phần hợp lý, nước ổn định và nguồn giống tốt thường quan trọng hơn việc dùng nhiều loại phụ gia.', 'Không tự áp dụng liều cố định cho mọi sản phẩm vì mật độ vi sinh và công thức rất khác nhau.']}]},
{id:'tamsoat',ic:'warn',t:'Xử lý nước bất thường',s:'Thao tác ưu tiên khi thiếu oxy, NH3, NO2 hoặc tảo tàn',src:['GN','GO','GP','VB'],blocks:[
 {table:[['Tình huống','Ưu tiên xử lý'],['DO thấp / tôm nổi đầu','Tăng sục khí ngay, kiểm tra hệ thống điện/quạt; giảm hoặc ngừng cho ăn tùy mức độ.'],['NH3/TAN tăng','Giảm lượng thức ăn dư; đo pH và nhiệt độ, tăng sục khí, đánh giá biện pháp xử lý nước phù hợp.'],['NO2 tăng','Kiểm tra độ mặn và clorua, khả năng nitrat hóa, sục khí và kiềm; tư vấn chuyên môn trước khi bổ sung muối hoặc hóa chất.'],['pH dao động lớn','Đo sáng và chiều, đánh giá tảo và khả năng đệm; điều chỉnh từ từ.'],['Tảo tàn / nước đổi màu nhanh','Theo dõi DO cả đêm, giảm thức ăn, theo dõi khí độc; tránh gây thêm sốc nước.']]},
 {p:'Các biểu hiện này có thể có nhiều nguyên nhân. Bảng chỉ là thứ tự ưu tiên kiểm tra, không phải phác đồ điều trị.'}]},
{id:'antoc',ic:'cal',t:'Lịch chăm sóc theo giai đoạn',s:'Trước thả – đầu vụ – giữa vụ – cuối vụ',src:['FAO','AAP','FS'],blocks:[
 {table:[['Giai đoạn','Việc nên theo dõi'],['Trước thả','Cải tạo ao, ao lắng, nước cấp, hệ thống sục khí, giống và kết quả kiểm tra bệnh.'],['Đầu vụ','Kiểm tra thích nghi và tỷ lệ sống; DO, nhiệt độ, pH, sức ăn, độ ổn định nước.'],['Giữa vụ','Cân mẫu và điều chỉnh khẩu phần theo sinh khối; NH3/NO2, kiềm, bùn đáy, sức khỏe tôm.'],['Cuối vụ','Duy trì oxy, tránh quá tải hữu cơ, theo dõi FCR và cỡ tôm; chuẩn bị thu hoạch và phương án xử lý vật tư dư.']]},
 {ul:['Mỗi ao có điều kiện khác nhau; lịch cần điều chỉnh theo mật độ, độ mặn, hệ thống tuần hoàn và thời tiết.', 'Ghi nhật ký nước, thức ăn, cân mẫu và xử lý ao để theo dõi xu hướng thay vì chỉ dựa vào một lần đo.']}]},
{id:'nuoc',ic:'water',t:'Chỉ số nước chuẩn',s:'Ngưỡng tối ưu và cách chỉnh từng chỉ số',src:['KN','GN','GP'],blocks:[
 {p:'Bảng ngưỡng của Khuyến nông Quốc gia cho giai đoạn thương phẩm. Đây là mô hình thâm canh có sục khí. Ao nhỏ mật độ thấp có thể linh hoạt hơn, nhưng nên giữ trong khoảng này.'},
 {table:[['Chỉ số','Tối ưu','Cách chỉnh'],
  ['DO','từ 5 mg/l','Tăng sục khí'],
  ['pH','7,7–8,2','Khuyến nông ghi: CaO 5 kg/1.000 m³ khi pH trên 7,7 và 10 kg/1.000 m³ khi pH dưới 7,7'],
  ['Nhiệt độ','26–33 °C','Nâng mực nước khi nắng nóng, chạy quạt khi mưa'],
  ['Độ mặn','10–25 ‰','Tùy điều kiện vùng nuôi'],
  ['Kiềm','120–150 mg/l','Sodium bicarbonate 5–10 kg/1.000 m³'],
  ['Canxi (Ca²⁺)','280–360 mg/l','Dolomite hoặc CaCO₃ 20 kg/1.000 m³'],
  ['Magie (Mg²⁺)','650–1.000 mg/l','Dolomite 20 kg/1.000 m³'],
  ['Amoniac','tối đa 1,0 mg/l','Bổ sung men vi sinh'],
  ['Nitrit (NO₂)','tối đa 0,1 mg/l','Bổ sung men vi sinh'],
  ['Tổng Vibrio','dưới 10³ CFU/ml','Glutaraldehyde hoặc iodine 1 lít/1.000 m³']]},
 {ul:['App hiểu ô Amoniac là tổng amoniac (TAN) đọc từ bộ test nước. Phần độc nhất là NH3 không ion hóa, tăng rất nhanh khi pH cao (xem mục pH và độ kiềm).',
  'Theo Global Seafood Alliance, ngưỡng cảnh báo NH3 không ion hóa khoảng 0,1 mg/l. Nitrit độc nhất ở độ mặn thấp (2–5 ‰) và hiếm khi gây vấn đề khi độ mặn trên 20 ‰.',
  'Sau mưa lớn: kiểm tra ngay độ mặn và pH (Báo Nông nghiệp và Môi trường).']}]},
{id:'choan',ic:'feed',t:'Cho ăn và sàng ăn',s:'Khẩu phần theo cỡ tôm, cách chỉnh theo sàng',src:['KN','AAP','FAO','TT'],blocks:[
 {p:'Thức ăn chiếm 50–60% chi phí sản xuất (AAP), hoặc 66–68% theo khảo sát FAO. Quản lý cho ăn quyết định 65–75% biến động FCR. App gợi ý lượng ăn ở mức thấp đến trung bình của các khoảng dưới đây, bạn chỉnh tiếp theo sàng ăn.'},
 {h:'Khẩu phần theo ngày tuổi (Khuyến nông, thức ăn 36% đạm)'},
 {table:[['Ngày tuổi','Cỡ viên','% thân/ngày'],['20–25','1,2 mm','8–12'],['26–35','1,2 mm','8 xuống 7,5'],['36–45','1,4 mm','7,5 xuống 5'],['46–52','1,6 mm','5 xuống 4,2'],['53–60','1,8 mm','4,2 xuống 3,6'],['61–78','2,0 mm','3,6 xuống 3,0'],['79–90','2,0 mm','3,0 xuống 2,5']]},
 {h:'Khẩu phần theo trọng lượng (bảng một hãng thức ăn, trích trong báo cáo FAO)'},
 {table:[['Trọng lượng','% thân/ngày','Số cữ'],['1–3 g','10–15','4'],['3–7 g','5–10','4'],['7–15 g','3–5','4–5'],['trên 15 g','dưới 3','4–5']]},
 {h:'Kiểm tra sàng ăn (Khuyến nông)'},
 {table:[['Cỡ tôm','Thức ăn trên sàng','Kiểm tra sau'],['1,5–6 g','10 g/kg thức ăn','120 phút'],['6–12 g','15 g/kg','90 phút'],['13–19 g','20 g/kg','60 phút'],['từ 20 g','20–25 g/kg','40 phút']]},
 {ul:['Sàng gần hết: tăng 5–10%. Còn ít: giữ nguyên. Dư nhiều: giảm 5–10% (Khuyến nông). AAP ghi mức chỉnh thường gặp từ cộng 5% đến trừ 10% mỗi ngày.',
  'Nếu thức ăn dư trên sàng quá 10%, giảm khẩu phần cữ sau (FAO).',
  'Cho ăn nhiều cữ nhỏ tốt hơn ít cữ lớn. Cho ăn tay thường 4 lần mỗi ngày.',
  'Tôm ăn khoảng 50–60% lượng thức ăn vào ban đêm (AAP).',
  'Tôm nhỏ dưới khoảng 3,5–4 g: cho ăn theo bảng cứng và lượng tối thiểu mỗi cữ, chưa dựa hẳn vào sinh khối ước tính (AAP).',
  'Cho ăn hơi dưới mức no thì FCR thấp nhất (AAP).',
  'Đổi cỡ viên: trộn viên cũ và mới tỉ lệ 50:50 trong 2–3 ngày, tránh tôm giảm ăn do đổi đột ngột (AAP).',
  'Tôm bị sốc: giảm 50% hoặc ngưng ăn 2–4 ngày (AAP).',
  'Trời âm u hoặc mưa dài ngày: giảm thức ăn 20–30%. Không tăng thức ăn đột ngột (Báo Nông nghiệp và Môi trường).',
  'Mỗi 1 °C đổi khoảng 8–10% tốc độ lớn. Nhiệt độ thấp làm tôm giảm ăn (AAP).',
  'Tăng trưởng trong khoảng ±10% đường chuẩn là chấp nhận được. Dưới đường chuẩn: kiểm tra nước, đáy ao, sức khỏe rồi mới tăng ăn. Trên đường chuẩn: cân nhắc giảm ăn để giữ FCR (AAP).',
  'Đạm theo cỡ (tiêu chuẩn quốc gia, trích trong FAO): 1–3 g 38%, 3–12 g 36%, 12–25 g 34%, trên 25 g 32%.']}]},
{id:'oxy',ic:'bubbles',t:'Oxy và sục khí',s:'Giữ DO ổn định, nhất là ban đêm',src:['GO','AAP','KN','TT','EHP'],blocks:[
 {ul:['Mục tiêu DO từ 5 mg/l (Khuyến nông). AAP khuyến nghị giữ ổn định quanh 6 mg/l. Bài về EHP nhấn mạnh DO phải trên 4 mg/l.',
  'DO đạt đỉnh chiều muộn nhờ tảo quang hợp, rồi giảm dần suốt đêm và thấp nhất lúc rạng sáng. DO chỉ bắt đầu hồi phục khoảng 2 giờ sau khi mặt trời mọc.',
  'Tăng số giờ chạy quạt vào đêm và rạng sáng. Nắng nóng kéo dài: tăng chạy quạt để bổ sung oxy và hạn chế phân tầng nước.',
  'DO thấp làm tôm giảm ăn. Cắt giảm thức ăn khi DO thấp, kể cả buổi sáng (AAP).',
  'Chuẩn bị điện hoặc máy phát dự phòng cho quạt nước, và có người trực khi nắng nóng xen mưa lớn (Báo Nông nghiệp và Môi trường).',
  'Cuối vụ, bùn đáy tạo nhu cầu oxy rất lớn. Không cho ăn ở khu vực bùn tụ giữa ao và tránh khuấy lớp bùn mặt vì có thể thoát khí H₂S (AAP).',
  'Thay nước chậm và có thể gây sốc cho tôm. Khi mất điện hoặc tảo tàn, cần có phương án bơm khí khẩn cấp (GO).']}]},
{id:'ph',ic:'water',t:'pH và độ kiềm',s:'Vì sao pH dao động và cách giữ ổn định',src:['GP','GN','KN','TT'],blocks:[
 {ul:['Khoảng pH chung cho thủy sản là 7,5–8,5 (GAA). Khuyến nông ghi tối ưu 7,7–8,2.',
  'Đo pH hai lần: khoảng 15–16 giờ chiều nắng và 7 giờ sáng hôm sau. Dao động ngày đêm lớn nghĩa là nước đệm yếu hoặc tảo quá nhiều (GAA).',
  'Nguyên nhân pH lên cao buổi chiều là tảo quang hợp. Ban đêm tảo hô hấp thải CO₂ làm pH xuống.',
  'pH quá cao làm tôm giảm ăn, chậm lớn, FCR xấu hơn, miễn dịch yếu, và làm tăng phần amoniac độc.',
  'Cách xử lý khi pH cao: giảm lượng ăn, tăng sục khí và tuần hoàn, thay một phần nước, bón vôi nếu kiềm thấp. Nếu kiềm đủ thì kiểm soát tảo (hớt váng, che nắng, tăng độ đục).',
  'Sau mưa pH giảm: tạt nước vôi đều quanh ao và điều chỉnh từ từ (Báo Nông nghiệp và Môi trường).']},
 {h:'Phần amoniac ở dạng độc NH3 theo pH (nước mặn 28 °C, GN)'},
 {table:[['pH','% NH3 trong tổng amoniac'],['7,0','0,6'],['7,5','1,8'],['8,0','5,5'],['8,5','15,6'],['9,0','36,8'],['9,5','64,8']]}]},
{id:'nh3',ic:'wind',t:'Amoniac và nitrit',s:'Khi nào nguy hiểm, cách hạ',src:['GN','KN','EHP'],blocks:[
 {ul:['Quá liều thức ăn là nguyên nhân chính làm xấu nước. Khi nước xấu: thay nước và hoặc giảm thức ăn (AAP).',
  'Cách hạ amoniac và nitrit: dùng thức ăn chất lượng cao, tránh cho ăn thừa, duy trì sục khí ban đêm và tuần hoàn ban ngày, giữ kiềm và pH trong khoảng, kiểm soát tảo lam làm pH tăng, hạn chế phân bón đạm, bổ sung men vi sinh (GAA, Khuyến nông).',
  'Tôm tiếp xúc NH3 0,28–1,14 mg/l có tỉ lệ chết 40–50% sau khi nhiễm Vibrio, so với 20–23% ở mức 0–0,06 mg/l (GAA).',
  'Ao nuôi dày, ít thay nước, ăn nhiều: tổng amoniac có thể lên 6–8 mg/l (GAA).',
  'Ao thâm canh nên đo amoniac và nitrit mỗi tuần (GAA).',
  'Nitrit chủ yếu là vấn đề ở độ mặn thấp. Có thể bổ sung muối để tăng clorua bảo vệ, tỉ lệ Cl⁻ : NO₂⁻ từ 6 đến 10 trở lên (GAA).']}]},
{id:'thoitiet',ic:'thermo',t:'Thời tiết xấu',s:'Nắng nóng, mưa lớn, trời âm u',src:['TT'],blocks:[
 {table:[['Tình huống','Việc cần làm'],
  ['Nắng nóng kéo dài','Tăng chạy quạt để bổ sung oxy và hạn chế phân tầng. Cấp thêm nước đúng lúc để giữ mực nước và giảm nhiệt.'],
  ['Mưa lớn, dông','Mở cống thoát linh hoạt để lớp nước mặt không biến động đột ngột. Kiểm tra ngay độ mặn và pH.'],
  ['pH giảm sau mưa','Tạt nước vôi đều quanh ao, điều chỉnh từ từ.'],
  ['Âm u hoặc mưa dài ngày','Giảm thức ăn 20–30%.'],
  ['Đêm và rạng sáng','Tăng giờ chạy quạt vì oxy thường xuống thấp.'],
  ['Định kỳ','Bổ sung men vi sinh để phân hủy chất hữu cơ, hạn chế khí độc đáy ao.']]},
 {ul:['Quan trọng nhất là không để tôm bị sốc. Không tăng thức ăn đột ngột.','Tôm giảm ăn, bơi lờ đờ, nổi đầu hoặc chết rải rác: báo sớm cho cán bộ khuyến ngư hoặc kỹ thuật để xác định nguyên nhân.']}]},

{id:'phongbenh',ic:'warn',t:'Phòng bệnh tổng hợp cho ao tôm',s:'An toàn sinh học từ chọn giống đến cuối vụ',src:['FS','FP','WO','WA'],blocks:[
 {p:'Phòng bệnh dựa trên quản lý nguồn giống, nguồn nước, con người, dụng cụ và môi trường ao. Không có một loại thuốc, vi sinh hay khoáng nào phòng được tất cả bệnh.'},
 {h:'Trước thả'},
 {ul:['Chọn giống có nguồn gốc rõ ràng và hồ sơ kiểm tra tác nhân gây bệnh phù hợp với khu vực; chú ý WSSV, AHPND, EHP.', 'Vệ sinh, cải tạo ao và loại bùn đáy theo quy trình phù hợp; kiểm tra nước cấp trước khi đưa vào ao.', 'Ngăn cua còng, chim và động vật trung gian; bố trí lưới, khu vực khử trùng, dụng cụ riêng cho từng ao.', 'Kiểm tra sục khí, điện dự phòng, mật độ thả và điều kiện nhiệt độ, độ mặn để giảm sốc cho giống.']},
 {h:'Trong vụ'},
 {ul:['Theo dõi sức ăn, gan tụy, ruột, màu sắc cơ thể, bơi lội và số tôm chết mỗi ngày.', 'Giữ oxy ổn định; ghi pH, kiềm, nhiệt độ, NH3/TAN, NO2 theo điều kiện và mật độ nuôi.', 'Không chia sẻ vợt, ống siphon hoặc dụng cụ từ ao nghi bệnh sang ao khác nếu chưa vệ sinh đúng quy trình.', 'Cho ăn theo sức ăn và sinh khối để giảm chất thải; kiểm tra chất lượng và cách bảo quản thức ăn.', 'Dùng chế phẩm thú y thủy sản hợp pháp đúng nhãn, không dùng kháng sinh để phòng bệnh một cách đại trà.']},
 {h:'Khi nghi có dịch'},
 {ul:['Hạn chế di chuyển người, tôm, nước và dụng cụ giữa các ao; không xả nước thải nghi nhiễm chưa được xử lý phù hợp.', 'Kiểm tra nhanh oxy và chất lượng nước; ghi nhận thời gian và mức độ bất thường.', 'Liên hệ kỹ thuật viên thú y thủy sản hoặc cơ quan chuyên môn để lấy mẫu xét nghiệm PCR, mô bệnh học hoặc phương pháp phù hợp.', 'Không tự kết luận bệnh từ một dấu hiệu; không tự đổ hóa chất hoặc kháng sinh xuống ao khi chưa đánh giá tác nhân và rủi ro.']}]},
{id:'wssv',ic:'warn',t:'Bệnh đốm trắng (WSSV)',s:'Lây lan nhanh, chết cấp tính và phòng lây nhiễm',src:['WO','FS'],blocks:[
 {p:'Bệnh đốm trắng do vi-rút WSSV. Đây là bệnh truyền nhiễm nghiêm trọng trên giáp xác; không có thuốc đặc hiệu được chứng minh chữa khỏi tôm mắc WSSV.'},
 {h:'Dấu hiệu nghi ngờ'},
 {ul:['Tôm giảm ăn, bơi yếu hoặc bơi bất thường; có thể xảy ra chết nhanh trong thời gian ngắn.', 'Một số tôm có đốm trắng trên vỏ nhưng không phải trường hợp nhiễm WSSV nào cũng biểu hiện đốm rõ.', 'Thời tiết thay đổi hoặc tôm bị stress có thể làm biểu hiện bệnh trầm trọng hơn.']},
 {h:'Phòng bệnh'},
 {ul:['Ưu tiên giống kiểm tra WSSV âm tính theo phương pháp được phòng xét nghiệm áp dụng.', 'Quản lý nước cấp và ngăn vật chủ trung gian như cua còng; không chuyển tôm sống hoặc nước ao bệnh sang ao khác.', 'Dùng dụng cụ riêng giữa các ao, kiểm soát khách ra vào và vệ sinh đúng quy trình.', 'Duy trì môi trường nước ổn định, không để thiếu oxy hay thay đổi đột ngột.']},
 {h:'Nếu nghi mắc bệnh'},
 {ul:['Khoanh vùng ao nghi bệnh và yêu cầu xét nghiệm chuyên môn để xác nhận.', 'Không tự bán/chuyển tôm sống hoặc xả nước nghi nhiễm sang nguồn nước chung.', 'Liên hệ cơ quan thú y thủy sản địa phương để được hướng dẫn xử lý và quản lý dịch phù hợp quy định.']}]},
{id:'ahpnd',ic:'warn',t:'Hoại tử gan tụy cấp (AHPND)',s:'Nhận biết và giảm nguy cơ bệnh do Vibrio mang độc tố',src:['WA','BN','FS'],blocks:[
 {p:'AHPND có liên quan đến một số vi khuẩn Vibrio mang gen độc tố PirA/PirB. Bệnh có thể gây chết nhanh, nhất là giai đoạn đầu vụ. Cần xét nghiệm để phân biệt với các vấn đề gan tụy khác.'},
 {h:'Dấu hiệu cần chú ý'},
 {ul:['Tôm giảm hoặc bỏ ăn đột ngột, gan tụy nhạt màu hoặc teo, ruột ít thức ăn.', 'Tôm yếu và chết tăng nhanh; biểu hiện có thể trùng với nhiễm trùng hoặc biến động môi trường khác.']},
 {h:'Phòng ngừa'},
 {ul:['Kiểm tra giống và chất lượng nước cấp; hạn chế đưa mầm bệnh từ dụng cụ hoặc ao khác vào.', 'Quản lý chất hữu cơ, thức ăn dư và đáy ao; đảm bảo đủ oxy.', 'Theo dõi sức ăn, gan tụy và số chết trong giai đoạn đầu vụ; lấy mẫu xét nghiệm khi bất thường.', 'Không lạm dụng kháng sinh; việc lựa chọn phương án can thiệp cần dựa trên chẩn đoán và tư vấn thú y thủy sản.']},
 {h:'Ứng phó'},
 {ul:['Kiểm tra đồng thời môi trường nước và nguyên nhân bệnh; yêu cầu xét nghiệm tác nhân AHPND khi nghi ngờ.', 'Hạn chế lây chéo giữa ao, ghi nhận diễn biến và làm theo hướng dẫn của cơ quan chuyên môn.']}]},
{id:'ehpguide',ic:'warn',t:'EHP – tôm chậm lớn, không đồng đều',s:'Vi bào tử trùng, quản lý bùn đáy và giống',src:['EHP','BN','FP'],blocks:[
 {p:'EHP (Enterocytozoon hepatopenaei) là vi bào tử trùng ký sinh ở gan tụy. Nhiễm EHP thường gây tăng trưởng kém và kích cỡ không đều, nhưng không thể chẩn đoán chỉ bằng dấu hiệu chậm lớn.'},
 {h:'Dấu hiệu nghi ngờ'},
 {ul:['Tôm cùng tuổi có kích cỡ chênh lệch nhiều, tăng trưởng chậm hoặc hệ số chuyển đổi thức ăn xấu.', 'Có thể đi kèm các vấn đề đường ruột, phân trắng do nhiều nguyên nhân khác nhau.', 'Xác nhận bằng xét nghiệm chuyên môn thay vì suy đoán từ màu phân hoặc kích cỡ.']},
 {h:'Phòng ngừa'},
 {ul:['Chọn giống được kiểm tra EHP; quản lý vệ sinh trại giống và nguồn thức ăn theo thông tin nhà cung cấp.', 'Làm sạch bùn đáy và vật chất hữu cơ khi chuẩn bị vụ; kiểm soát nước cấp và nguồn lây chéo.', 'Theo dõi cỡ tôm định kỳ, hiệu quả cho ăn và xét nghiệm khi có dấu hiệu chậm lớn bất thường.', 'Không kỳ vọng vi sinh, kháng sinh hoặc hóa chất thông thường loại bỏ EHP khi tôm đã nhiễm.']}]},
{id:'phantrang',ic:'warn',t:'Hội chứng phân trắng & đường ruột',s:'Nhận biết, phân biệt nguyên nhân và chăm sóc',src:['EHP','BN','AAP'],blocks:[
 {p:'Phân trắng là một hội chứng có thể liên quan đến nhiều yếu tố như EHP, vi khuẩn, chất lượng thức ăn và môi trường. Không xem phân trắng là bằng chứng chắc chắn của một tác nhân cụ thể.'},
 {h:'Dấu hiệu'},
 {ul:['Các sợi phân nhạt hoặc trắng trên mặt nước, sàng ăn; tôm có thể giảm ăn hoặc đường ruột không đầy.', 'Có thể tăng trưởng chậm, cỡ tôm không đều hoặc biểu hiện gan tụy bất thường.']},
 {h:'Kiểm tra và phòng ngừa'},
 {ul:['Kiểm tra khẩu phần, chất lượng thức ăn, kho bảo quản và lượng thức ăn dư trên sàng.', 'Đo oxy, pH, NH3/TAN, NO2; kiểm tra đáy ao, bùn và sức khỏe tôm.', 'Thu mẫu và tham vấn xét nghiệm vi khuẩn hoặc EHP nếu biểu hiện kéo dài.', 'Không tự trộn kháng sinh, hóa chất hoặc nhiều chế phẩm với kỳ vọng chữa mọi nguyên nhân phân trắng.']}]},
{id:'benhkiemtra',ic:'cal',t:'Bảng kiểm tra dấu hiệu bệnh mỗi ngày',s:'Quy trình quan sát và ghi nhận trước khi xử lý',src:['FAO','FS','FP'],blocks:[
 {table:[['Quan sát','Điều cần ghi'],['Sức ăn','Sàng ăn còn dư, lượng giảm so với hôm trước, thời điểm bất thường'],['Tôm','Bơi lội, màu sắc, vỏ, cơ, tỷ lệ sống và số chết'],['Gan tụy & ruột','Màu gan tụy, độ đầy ruột, kích cỡ không đồng đều'],['Nước','DO, nhiệt độ, pH, kiềm, TAN/NH3, NO2 nếu có thể'],['Điều kiện ao','Mưa, tảo đổi màu, mất điện, quạt khí, bùn đáy']]},
 {h:'Khi nào cần gọi kỹ thuật viên?'},
 {ul:['Tôm chết tăng nhanh, giảm ăn rõ rệt hoặc bơi lờ đờ/nổi đầu.', 'Gan tụy bất thường, phân trắng kéo dài, chậm lớn nhiều hoặc cỡ tôm quá chênh lệch.', 'Thông số nước nguy hiểm hoặc thay đổi nhanh mà không rõ nguyên nhân.', 'Yêu cầu kỹ thuật viên hướng dẫn lấy mẫu và xét nghiệm; kết quả lâm sàng chỉ có tính định hướng.']}]},
{id:'benh',ic:'warn',t:'Bệnh thường gặp',s:'EHP, đốm trắng, hoại tử gan tụy, cách phòng',src:['BN','EHP','KN','FAO'],blocks:[
 {table:[['Bệnh','Dấu hiệu và lưu ý'],
  ['EHP (vi bào tử trùng)','Tôm còi, lớn chậm, kích cỡ không đều, phân lỏng, tốn thức ăn. Không chết nhanh nhưng làm tôm không đạt cỡ. Bào tử tồn tại lâu trong bùn đáy và lây qua nước, phân. Đi kèm Vibrio có thể thành hội chứng phân trắng.'],
  ['Đốm trắng (WSSV)','Lây nhanh, tỉ lệ chết rất cao. Hay bùng phát khi thời tiết chuyển mùa.'],
  ['Hoại tử gan tụy cấp (AHPND)','Do Vibrio mang độc tố PirA/PirB. Nguy hiểm nhất khi tôm 10–45 ngày sau thả. Lạm dụng kháng sinh không hiệu quả ổn định và gây kháng thuốc.'],
  ['Mờ đục hậu ấu trùng (TPD)','Chủ yếu ở trại giống, PL4–PL7. Cơ thể trong suốt, gan ruột mờ đục, bơi yếu, tụ đáy.']]},
 {h:'Phòng bệnh'},
 {ul:['Chọn giống sạch bệnh có kết quả PCR (WSSV, AHPND, EHP, TPD), không thả mật độ vượt khả năng quản lý.',
  'Cải tạo ao kỹ trước khi thả: loại bùn đáy, chất thải hữu cơ và vật chủ trung gian. Có thể dùng vôi nông nghiệp hoặc chất sát trùng.',
  'Có ao lắng và ao lọc xử lý nước cấp. Lắp lưới chắn cua, còng vì chúng mang và phát tán mầm bệnh. Ao lót bạt giúp gom chất thải.',
  'Giữ DO trên 4 mg/l, theo dõi thường xuyên pH, kiềm, nhiệt độ, khoáng.',
  'Dùng men vi sinh định kỳ để ức chế Vibrio. Bổ sung vitamin C, beta-glucan để tăng sức đề kháng. Tránh lạm dụng kháng sinh.',
  'Khuyến nông: đánh giá gan tụy và đường ruột 2 lần mỗi tuần, xét nghiệm PCR (WSSV, EHP, AHPND) mỗi 15 ngày. Kết quả dương tính thì khuyến cáo thu hoạch.',
  'Khi nghi có dịch, các bài báo khuyên liên hệ cơ quan thú y hoặc khuyến ngư địa phương. Bài viết không nêu quy trình xử lý chi tiết.']}]},
{id:'chuanbi',ic:'pond',t:'Chuẩn bị ao và thả giống',s:'Cải tạo, mật độ, chọn giống',src:['TH','BN','EHP','KN','FAO'],blocks:[
 {ul:['Độ sâu ao trên 1,5 m với nuôi thâm canh và bán thâm canh. Quảng canh cải tiến trên 1 m (Thanh Hóa).',
  'Đưa chất thải và tạp chất ra khỏi ao. Ao không tháo cạn được thì dùng bơm sục đáy để rửa. Bón vôi theo pH đất. Ao phèn cần thau rửa 2–3 lần (Thanh Hóa).',
  'FAO ghi vôi bón khi chuẩn bị ao 150–400 kg/1.000 m², và không khuyến nghị bón phân trong giai đoạn nuôi vì thức ăn đạm cao đã gây phú dưỡng.',
  'Mật độ: Thanh Hóa nêu ao thâm canh 80–100 con/m² và nuôi 2 vụ mỗi năm. Khuyến nông nêu mô hình công nghệ cao 100–300 con/m². Hãy chọn mật độ theo khả năng sục khí và quản lý của bạn.',
  'Thả giống sạch bệnh có PCR. Liên kết với trại giống uy tín và theo dõi tôm giống chậm lớn hay nhiễm bệnh trong giai đoạn đầu.']}]},
{id:'chitieu',ic:'trend',t:'Chỉ tiêu mục tiêu',s:'FCR, thời gian nuôi, cỡ thu hoạch',src:['KN','FAO','AAP'],blocks:[
 {table:[['Chỉ tiêu','Giá trị (Khuyến nông, mô hình thâm canh công nghệ cao)'],['FCR','1,25–1,45'],['Thời gian nuôi','95–110 ngày'],['Cỡ thu hoạch trung bình','30 con/kg'],['Năng suất','trên 25 tấn/ha/vụ'],['Chất thải rắn','0,20–0,40 kg khô mỗi kg tôm']]},
 {ul:['Khảo sát FAO (97 hộ, 2010) ghi thời gian nuôi thường 80–100 ngày, thu cỡ 10–12 g, năng suất 10–20 tấn/ha/vụ ở miền Trung. Số liệu cũ, chỉ để so sánh.',
  'Phần lớn thức ăn dùng vào khoảng 2 tháng cuối của vụ 90–120 ngày, nên quản lý sàng ăn quan trọng nhất giai đoạn này (AAP).']}]},
{id:'lich',ic:'cal',t:'Lịch kiểm tra định kỳ',s:'Việc làm hằng ngày, hằng tuần',src:['GP','TT','KN','GN'],blocks:[
 {table:[['Khi nào','Việc cần làm'],
  ['Hằng ngày','Đo nhiệt độ, độ mặn, pH, DO, kiềm. Đo pH lúc 7 giờ sáng và 15–16 giờ chiều. Kiểm tra độ trong và sức ăn trên sàng sau mỗi cữ. Xi phông đáy.'],
  ['Mỗi đêm','Chạy quạt đủ giờ, nhất là rạng sáng.'],
  ['2 lần mỗi tuần','Đánh giá gan tụy và đường ruột (Khuyến nông).'],
  ['Mỗi tuần','Đo amoniac và nitrit (GAA).'],
  ['Mỗi 15 ngày','Xét nghiệm PCR WSSV, EHP, AHPND (Khuyến nông).'],
  ['Định kỳ','Cân mẫu để so tăng trưởng với đường chuẩn.']]}]}
];
function kbById(id){return KB.filter(function(k){return k.id===id;})[0];}
/* ---------- Lời khuyên theo dữ liệu ao ---------- */
function trayMin(w){return w<6?120:w<12?90:w<20?60:40;}
function adviceFor(c,p,s){
  var t=todayStr(),A=[],lw=latestWater(s.E);
  function add(lv,title,sub,steps,topic,src){A.push({lv:lv,t:title,s:sub,steps:steps,topic:topic,src:src,pid:p.id});}
  function wv(k){var x=lw[k];return x&&dayDiff(x.d,t)<=2?x:null;}
  function when(x){return x.d===t?'hôm nay':dmy(x.d);}
  var x;
  if((x=wv('do'))&&x.s.lv!=='good')add(x.s.lv,'DO '+fmt(x.v,1)+' mg/l, thấp','Đo '+when(x)+'. Mục tiêu từ 5 mg/l.',[
    'Chạy thêm quạt nước và sục khí ngay. Oxy thấp nhất vào đêm và rạng sáng.',
    'Giảm hoặc tạm ngưng cữ ăn kế tiếp vì DO thấp làm tôm giảm ăn.',
    'Kiểm tra nguồn điện và quạt, chuẩn bị điện dự phòng.',
    'Đo lại sau 1 giờ. DO chỉ hồi phục khoảng 2 giờ sau khi mặt trời mọc.',
    'Tôm nổi đầu, bơi lờ đờ hoặc chết rải rác: báo ngay cán bộ khuyến ngư hoặc kỹ thuật.'],'oxy','GAA, Khuyến nông, báo NN&MT');
  if((x=wv('ph'))&&x.v>8.5)add(x.s.lv,'pH '+fmt(x.v,1)+', cao','Đo '+when(x)+'. Khoảng chung 7,5–8,5.',[
    'Giảm lượng thức ăn để giảm amoniac và chất dinh dưỡng.',
    'Tăng sục khí và tuần hoàn nước.',

var SUP_KEY='aotom.suppliers.v1',PROD_KEY='aotom.products.v1',ISSUE_KEY='aotom.issues.v1';
function readJson(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback;}catch(e){return fallback;}}
var suppliers=readJson(SUP_KEY,[]),products=readJson(PROD_KEY,{}),issues=readJson(ISSUE_KEY,[]),stockReturns=readJson('aotom.stockreturns.v1',[]),deletedProducts=readJson('aotom.deletedproducts.v1',[]);
function supplierName(v){return typeof v==='string'?v:(v&&v.name)||'';}
function supplierPayment(name){var r=suppliers.find(function(v){return supplierName(v)===name;});return r&&typeof r==='object'&&r.paymentMethod==='cash'?'cash':'debt';}
function supplierHasPreference(name){return suppliers.some(function(v){return supplierName(v)===name&&typeof v==='object'&&!!v.paymentMethod;});}
function syncSupplierPayment(f,oldBuy){var name=f.elements.agency.value,method=supplierHasPreference(name)?supplierPayment(name):(oldBuy&&name===oldBuy.supplier&&oldBuy.paymentMethod==='cash'?'cash':'debt');f.elements.paymethod.value=method;var note=f.querySelector('#supplier-payment-note');if(note)note.textContent=name?(method==='cash'?'Trả thẳng · tự động theo NCC':'Công nợ · tự động theo NCC'):'Chọn nhà cung cấp để tự áp dụng thanh toán';}

function invSave(){try{localStorage.setItem(SUP_KEY,JSON.stringify(suppliers));localStorage.setItem(PROD_KEY,JSON.stringify(products));localStorage.setItem(ISSUE_KEY,JSON.stringify(issues));localStorage.setItem('aotom.stockreturns.v1',JSON.stringify(stockReturns));localStorage.setItem('aotom.deletedproducts.v1',JSON.stringify(deletedProducts));}catch(e){toast('Bộ nhớ đầy, hãy sao lưu dữ liệu.');}}
function allProducts(){var names={};PRODUCT_CATALOG.forEach(function(x){names[x[0]]=1;});Object.keys(products).forEach(function(x){names[x]=1;});buyList().forEach(function(b){(b.items||[]).forEach(function(i){names[i.n]=1;});});return Object.keys(names).filter(function(n){return deletedProducts.indexOf(n)===-1;}).sort(function(a,b){return a.localeCompare(b,'vi');});}
function inboundKg(i){if(i.stockKg!=null)return +i.stockKg||0;var u=(i.u||'').toLowerCase().trim();if(u==='kg'||u==='kilogram')return +i.q||0;if(['bao','gói','chai','can','thùng'].indexOf(u)!==-1){var x=products[i.n];return x&&x.kgPerBag?(+i.q||0)*x.kgPerBag:0;}if(u==='g')return (+i.q||0)/1000;return 0;}
function stockOf(name){var ins=0,outs=0;buyList().forEach(function(b){(b.items||[]).forEach(function(i){if(i.n===name)ins+=inboundKg(i);});});issues.forEach(function(e){if(e.product===name)outs+=+e.kg||0;});var ret=0;stockReturns.forEach(function(e){if(e.product===name)ret+=+e.kg||0;});return {inKg:ins,outKg:outs,returnedKg:ret,balance:Math.round((ins-outs-ret)*1000)/1000};}
/* Thống kê tồn kho từ các phiếu đã nhập, không tính sản phẩm chỉ có trong danh mục. */
function warehouseCategorySummary(){
 var available=allProducts().filter(function(n){return stockOf(n).inKg>0;});
 var cats=categoryList().slice();
 available.forEach(function(n){var p=products[n]||{},c=catalogItem(n),cat=p.category||(c&&c[1])||'Khác';if(cats.indexOf(cat)<0)cats.push(cat);});
 return cats.map(function(cat){
  var items=available.filter(function(n){var p=products[n]||{},c=catalogItem(n);return (p.category||(c&&c[1])||'Khác')===cat;});
  var remaining=items.filter(function(n){return stockOf(n).balance>0;});
  return {name:cat,items:items,availableCount:remaining.length,empty:remaining.length===0};
 });
}

 var options='<option value="all"'+(selected==='all'?' selected':'')+'>Tất cả ao</option>'+PONDS.map(function(p){return '<option value="'+esc(p.id)+'"'+(selected===p.id?' selected':'')+'>'+esc(p.name)+'</option>';}).join('');

 '<div class="report-tabs">'+[['profit','Lãi / lỗ'],['cost','Chi phí'],['feed','Thức ăn'],['harvest','Thu hoạch'],['stock','Tồn kho'],['debt','Công nợ']].map(function(a){return '<button data-act="reporttype" data-v="'+a[0]+'" class="'+(type===a[0]?'on':'')+'">'+a[1]+'</button>';}).join('')+'</div>';

 if(type==='profit'){

function submitBuy(f,editId){
  var err=$('#err');function bad(m){err.textContent=m;}
  var items=[],tot=0,okAll=true;
  f.querySelectorAll('.bline').forEach(function(l){
    var n=l.querySelector('[name=quickitem]').value.trim(),q=num(l.querySelector('[name=q]').value);
    if(!n&&!q)return;
    var m=buyProductMeta(n),price=buyLinePrice(l),u=m.unit.toLowerCase().trim(),kg=0;
    if(!n||!Number.isFinite(q)||q<=0||!Number.isFinite(price)||price<=0){okAll=false;return;}
    if(u==='kg'||u==='kilogram')kg=q;
    else if(u==='g')kg=q/1000;
    else if(['bao','gói','chai','can','thùng'].indexOf(u)!==-1)kg=q*m.kgPerBag;
    else if(m.kgPerBag>0)kg=q*m.kgPerBag;
    if(!Number.isFinite(kg)||kg<=0){okAll=false;return;}
    items.push({n:n,c:m.category,u:m.unit,q:q,p:price,stockKg:kg,img:''});tot+=q*price;
  });
  if(!okAll)return bad('Vui lòng chọn sản phẩm, nhập số lượng, giá nhập (nếu chưa có) và kiểm tra khối lượng quy đổi trong Danh mục.');
  if(!items.length)return bad('Chọn ít nhất một sản phẩm.');
  if(!f.elements['agency'].value)return bad('Vui lòng chọn nhà cung cấp.');
  var d=f.elements['d'].value||todayStr(),paid=f.elements['paymethod'].value==='cash'?Math.round(tot):0;
  var pr=f.querySelector('input[name=bpond]:checked'),pid=pr?pr.value:'',c=null;
  if(pid){c=activeCrop(pid);if(!c)return bad('Ao này chưa có vụ nuôi.');if(dayDiff(c.stockDate,d)<0)return bad('Ngày nhập trước ngày thả giống ('+dmy(c.stockDate)+').');}
  var same=buyList().filter(function(x){return x.d===d;}).length+1;
  var original=editId?buys[editId]:null;
  if(editId&&!original)return bad('Không tìm thấy phiếu cần sửa.');
  var b={id:original?original.id:'b'+uid(),d:d,ts:original?original.ts:Date.now(),supplier:f.elements['agency'].value,paymentMethod:f.elements['paymethod'].value,items:items,paid:original?Math.min(tot,original.paymentMethod==='cash'&&f.elements['paymethod'].value==='cash'?tot:(f.elements['paymethod'].value==='cash'?tot:(f.elements['paymethod'].value==='debt'&&original.paymentMethod==='cash'?0:(original.paid||0)))):paid,note:f.elements['note'].value.trim(),pond:pid,no:original?original.no:'NH'+d.replace(/-/g,'').slice(2)+'-'+p2(same)};
  /* Synchronize recorded pond costs without duplicating entries when a slip is edited. */
  Object.keys(crops).forEach(function(k){var cur=crops[k];if((cur.entries||[]).some(function(e){return e.purchase===b.id;})){
    var upd=JSON.parse(JSON.stringify(cur));upd.entries=upd.entries.filter(function(e){return e.purchase!==b.id;});commit(upd);
  }});
  if(c){
    var nc=JSON.parse(JSON.stringify(activeCrop(pid)||c)),g={};items.forEach(function(i){g[i.c]=(g[i.c]||0)+i.q*i.p;});
    Object.keys(g).forEach(function(k){nc.entries.push({id:uid(),t:'cost',d:d,tm:nowTime(),ts:Date.now(),cat:k,amount:Math.round(g[k]),note:'Nhập hàng '+b.no+(b.supplier?' · '+b.supplier:''),purchase:b.id});});
    commit(nc);
  }
  buySave(b);sheetClose();toast(original?'Đã cập nhật phiếu '+b.no:'Đã lưu phiếu '+b.no);
}

function loadH2P(){
  return new Promise(function(res,rej){
    if(window.html2pdf)return res();
    var sc=document.createElement('script'),to=setTimeout(function(){rej(new Error('timeout'));},15000);
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    sc.onload=function(){clearTimeout(to);window.html2pdf?res():rej(new Error('missing'));};
    sc.onerror=function(){clearTimeout(to);rej(new Error('load'));};
    document.head.appendChild(sc);
  });
}
function pdfHost(html){
  var host=document.getElementById('pdfhost');
  if(!host){host=document.createElement('div');host.id='pdfhost';document.body.appendChild(host);}
  host.style.cssText='';host.innerHTML='<div id="pdfroot" class="pdf">'+html+'</div>';return host;
}
function printFallback(){
  var host=document.getElementById('pdfhost');if(!host)return;
  document.body.classList.add('printing');
  var done=function(){document.body.classList.remove('printing');host.innerHTML='';window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  toast('Chọn “Lưu thành PDF” trong hộp thoại in');
  try{setTimeout(function(){window.print();},300);}catch(e){done();toast('Không tạo được PDF.');}
}
function pdfExport(html,filename){

  loadH2P().then(function(){return document.fonts&&document.fonts.ready;}).then(function(){
    return window.html2pdf().set({margin:[10,10,12,10],filename:filename,image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['tr','.sig']}}).from(document.getElementById('pdfroot')).save();
  }).then(function(){var h=document.getElementById('pdfhost');if(h)h.innerHTML='';toast('Đã tạo file '+filename);}).catch(function(){printFallback();});

function openXfer(pid){
  var p=pondOf(pid),c=activeCrop(pid);if(!c)return;
  var s=stats(c,p),m=money(c),rem=100-sum(c.xfers||[],function(x){return x.pct;});
  var empt=PONDS.filter(function(q){return q.id!==pid&&!activeCrop(q.id);});
  var h='<div class="panel-h"><div><div class="eyebrow">'+p.name+' · '+typeLabel(c)+'</div><h2>Chuyển sang ao nuôi</h2></div><button class="x" data-act="close" aria-label="Đóng">×</button></div>';
  if(!empt.length){sheetOpen(h+'<div class="empty">Chưa có ao trống để nhận tôm. Kết thúc vụ ở một ao khác, hoặc chờ ao trống, rồi quay lại chuyển ao.</div>');return;}
  var ds=Math.round(((c.xSurv!=null?c.xSurv:s.surv*100))*10)/10;
  h+='<form id="xform" novalidate><div class="stack" style="gap:14px">'+
   '<div class="fld"><label for="f_xd">Ngày chuyển</label><div class="inp"><input id="f_xd" name="d" type="date" value="'+todayStr()+'"></div></div>'+
   '<div class="fgrid"><div class="fld"><label for="f_xs">Tỉ lệ sống</label><div class="inp"><input id="f_xs" name="surv" type="text" inputmode="decimal" value="'+String(ds).replace('.',',')+'" autocomplete="off"><u>%</u></div></div>'+
   '<div class="fld"><label for="f_xp">Tỉ lệ sang ao này</label><div class="inp"><input id="f_xp" name="pct" type="text" inputmode="decimal" value="'+String(Math.round(rem*10)/10).replace('.',',')+'" autocomplete="off"><u>%</u></div></div></div>'+
   '<div class="hint" style="margin-top:-8px">Tỉ lệ sang ao tính trên số tôm còn sống. Còn '+fmt(rem,0)+'% chưa chuyển.</div>'+
   '<div class="fld"><span class="lab">Ao nhận</span><div class="opts">'+empt.map(function(q,i){return '<label class="opt"><input type="radio" name="to" value="'+q.id+'"'+(i===0?' checked':'')+'><span>'+q.name+' · '+q.area+' m²</span></label>';}).join('')+'</div></div>'+
   '<div class="fld"><label for="f_xg">Cỡ tôm lúc chuyển (tùy chọn)</label><div class="inp"><input id="f_xg" name="g" type="text" inputmode="decimal" autocomplete="off"><u>g/con</u></div></div>'+
   '<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:2px" id="xprev"></div>'+
   '<div class="err" id="err" role="alert"></div><button class="cta block" type="submit">Chuyển ao</button></div></form>';
  sheetOpen(h);
  var f=$('#xform');
  function calc(){
    var sv=num(f.surv.value),pc=num(f.pct.value),r=f.querySelector('input[name=to]:checked'),q=r?pondOf(r.value):null;
    if(!sv||!pc||sv<=0||pc<=0){$('#xprev').innerHTML='<span class="hint">Nhập tỉ lệ sống và tỉ lệ sang ao.</span>';return null;}
    var alive=c.qty*sv/100,cnt=Math.round(alive*pc/100),cost=rem>0?m.cost*pc/rem:0;
    $('#xprev').innerHTML='<div class="dl"><span>Tôm còn sống ước tính</span><b class="num">'+fmt(alive)+' con</b></div><div class="dl"><span>Tôm chuyển sang ao</span><b class="num">'+fmt(cnt)+' con</b></div><div class="dl"><span>Chi phí chuyển theo</span><b class="num">'+mny(cost)+'</b></div><div class="dl"><span>Giá vốn giống</span><b class="num">'+(cnt?mny(cost/cnt)+'/con':'—')+'</b></div>'+(q?'<div class="dl"><span>Mật độ ao nhận</span><b class="num">'+fmt(cnt/q.area)+' con/m²</b></div>':'');
    return {sv:sv,pc:pc,cnt:cnt,cost:cost,q:q};
  }
  f.addEventListener('input',calc);f.addEventListener('change',calc);calc();
  f.addEventListener('submit',function(ev){
    ev.preventDefault();var err=$('#err'),x=calc();
    if(!x)return err.textContent='Nhập tỉ lệ sống và tỉ lệ sang ao.';
    if(x.sv>100)return err.textContent='Tỉ lệ sống tối đa 100%.';
    if(x.pc>rem+0.0001)return err.textContent='Chỉ còn '+fmt(rem,1)+'% chưa chuyển.';
    if(!x.q)return err.textContent='Chọn ao nhận.';
    if(x.cnt<=0)return err.textContent='Số tôm chuyển bằng 0.';
    var d=f.d.value||todayStr();if(dayDiff(c.stockDate,d)<0)return err.textContent='Ngày chuyển trước ngày thả giống ('+dmy(c.stockDate)+').';
    if(activeCrop(x.q.id))return err.textContent='Ao nhận đã có vụ nuôi.';
    var g=num(f.g.value),newId='c'+uid(),nc=JSON.parse(JSON.stringify(c)),catG={},gross=0;
    (c.entries||[]).forEach(function(e){if(e.t==='cost'){catG[e.cat]=(catG[e.cat]||0)+(e.amount||0);gross+=e.amount||0;}});
    var ratio=gross>0?x.cost/gross:0,ents=[],moved=0;
    Object.keys(catG).forEach(function(k){var a=Math.round(catG[k]*ratio);if(a>0){moved+=a;ents.push({id:uid(),t:'cost',d:d,tm:'00:00',ts:Date.now(),cat:k,amount:a,note:'Chuyển từ ao ương '+p.name,xfer:true,from:c.id});}});
    if(g&&g>0)ents.push({id:uid(),t:'abw',d:d,tm:nowTime(),ts:Date.now(),g:Math.round(g*100)/100});
    var nw={id:newId,pond:x.q.id,stockDate:d,qty:x.cnt,source:'Ương từ '+p.name,ageOff:(c.ageOff||0)+Math.max(0,dayDiff(c.stockDate,d)),pl:c.pl,status:'active',type:'grow',from:{crop:c.id,pond:pid,pct:x.pc,cost:moved},entries:ents};
    nc.xSurv=x.sv;nc.xfers=(nc.xfers||[]).concat([{id:uid(),d:d,to:newId,pond:x.q.id,toName:x.q.name,pct:x.pc,count:x.cnt,cost:moved,surv:x.sv}]);
    nc.entries.push({id:uid(),t:'xfer',d:d,tm:nowTime(),ts:Date.now(),count:x.cnt,pct:x.pc,cost:moved,toName:x.q.name,to:newId});
    var done=false;if(sum(nc.xfers,function(z){return z.pct;})>=99.999){nc.status='done';nc.endDate=d;done=true;}
    commit(nc);commit(nw);sheetClose();ui.view='pond';ui.pond=x.q.id;render();window.scrollTo(0,0);
    toast('Đã chuyển '+fmt(x.cnt)+' con sang '+x.q.name+(done?', kết thúc vụ ương':''));
  });
}

function num(v,money){if(v==null)return null;v=String(v).trim();if(!v)return null;if(money)v=v.replace(/[.,\s]/g,'');else v=v.replace(/\s/g,'').replace(',','.');var n=parseFloat(v);return isNaN(n)?null:n;}
function submitForm(f,kind,pid){
  var F=FORMS[kind],p=pondOf(pid),fields=F.fields({entries:[]}),v={},err=$('#err');
  function g(k){var el=f.elements[k];if(!el)return '';if(el.length&&el[0]&&el[0].type==='radio'){for(var i=0;i<el.length;i++)if(el[i].checked)return el[i].value;return '';}return el.value;}
  function bad(m){err.textContent=m;}
  fields.forEach(function(x){var raw=g(x.k);v[x.k]=x.type==='num'?num(raw):x.type==='money'?num(raw,true):String(raw||'').trim();});
  var d=g('d')||todayStr(),tm=g('tm')||nowTime();
  if(kind==='stock'){
    if(!v.qty||v.qty<=0)return bad('Nhập số lượng giống.');
    var c={id:'c'+uid(),pond:pid,stockDate:d,qty:v.qty,source:v.source,pl:v.pl,status:'active',type:v.type==='Ương giống'?'nursery':'grow',entries:[]};
    if(v.price&&v.price>0)c.entries.push({id:uid(),t:'cost',d:d,tm:'00:00',ts:Date.now(),cat:'Giống',amount:Math.round(v.qty*v.price),note:'Giá '+fmt(v.price)+' đ/con'+(v.source?' · '+v.source:'')});
    commit(c);sheetClose();ui.view='pond';ui.pond=pid;render();window.scrollTo(0,0);toast('Đã thả giống '+fmt(v.qty)+' con vào '+p.name+(v.type==='Ương giống'?' (ao ương)':''));return;
  }
  var c2=activeCrop(pid);if(!c2)return bad('Ao này chưa có vụ nuôi.');
  if(dayDiff(c2.stockDate,d)<0)return bad('Ngày ghi trước ngày thả giống ('+dmy(c2.stockDate)+').');
  var e={id:uid(),t:kind,d:d,tm:tm,ts:Date.now(),by:getMe()};
  if(kind==='feed'){if(!v.kg||v.kg<=0)return bad('Nhập lượng thức ăn (kg).');e.kg=v.kg;e.meal=v.meal;e.feed=v.feed;}
  else if(kind==='water'){var any=false;WP.forEach(function(q){if(v[q.k]!=null){e[q.k]=v[q.k];any=true;}});if(!any)return bad('Nhập ít nhất một chỉ số.');e.session=v.session;}
  else if(kind==='abw'){var gg=v.g;if(!gg&&v.cpk)gg=1000/v.cpk;if(!gg||gg<=0)return bad('Nhập gram mỗi con hoặc số con trên kg.');e.g=Math.round(gg*100)/100;if(v.surv){if(v.surv<=0||v.surv>100)return bad('Tỉ lệ sống phải từ 1 đến 100.');e.surv=v.surv;}}
  else if(kind==='cost'){if(!v.cat)return bad('Chọn loại chi phí.');if(!v.amount||v.amount<=0)return bad('Nhập số tiền.');e.cat=v.cat;e.amount=v.amount;e.note=v.note;}
  else if(kind==='harvest'){if(!v.kg||v.kg<=0)return bad('Nhập khối lượng thu.');e.kind=v.kind;e.kg=v.kg;if(v.size)e.size=v.size;if(v.price)e.price=v.price;if(v.buyer)e.buyer=v.buyer;}
  else if(kind==='treat'){if(!v.act)return bad('Chọn việc đã làm.');e.act=v.act;e.qty=v.qty;e.note=v.note;}
  else if(kind==='death'){if(!v.count&&!v.note)return bad('Nhập số con hoặc ghi quan sát.');if(v.count)e.count=v.count;e.note=v.note;}
  else if(kind==='note'){if(!v.text)return bad('Nhập nội dung ghi chú.');e.text=v.text;}
  var nc=JSON.parse(JSON.stringify(c2));nc.entries.push(e);
  var done=false;if(kind==='harvest'&&v.kind==='Thu toàn bộ'){nc.status='done';nc.endDate=d;done=true;}
  commit(nc);sheetClose();toast(done?'Đã thu hoạch và kết thúc vụ ở '+p.name:'Đã lưu');
}

  else if(a==='bdelyes'){buyRemove(id);sheetClose();toast('Đã xóa phiếu');}

  else if(a==='brpt'){var bl2=bFilter();if(bl2.length){pdfExport(reportHtml(bl2),'nhap-hang-'+(ui.buyScope==='all'?'tat-ca':ui.buyMonth)+'.pdf');}}
}
document.addEventListener('submit',function(ev){if(ev.target&&ev.target.id==='weather-city-form'){ev.preventDefault();var val=String(ev.target.elements.city.value||'').trim();if(val.length>=2)chooseWeatherCity(val);else toast('Nhập tên địa phương');}});

document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t&&t.getAttribute&&t.getAttribute('data-role')==='product-filter-text'){
    ui.productFilterText=t.value||''; if(ui.view==='inventory'&&(ui.menuSection||'menu')==='products'){var pos=t.selectionStart;render();var next=document.querySelector('[data-role="product-filter-text"]');if(next){next.focus();try{next.setSelectionRange(pos,pos);}catch(e){}}}
  }
});
document.addEventListener('change',function(ev){
  if(ev.target&&ev.target.getAttribute){var rr=ev.target.getAttribute('data-role');if(rr==='report-pond'||rr==='report-scope'){if(rr==='report-pond')ui.reportPond=ev.target.value;else ui.reportScope=ev.target.value;render();return;}}
  var t=ev.target;
  if(!t||!t.getAttribute)return;
  var role=t.getAttribute('data-role');
  if(role==='product-filter-category'){ui.productFilterCategory=t.value||'all'; if(ui.view==='inventory') render();}
  else if(role==='product-filter-stock'){ui.productFilterStock=t.value||'all'; if(ui.view==='inventory') render();}
});

document.addEventListener('click',onClick);
document.addEventListener('keydown',function(e){if(e.key==='Escape')sheetClose();});

$('#nb-home').innerHTML=ic('home')+'Tổng quan';
$('#nb-adv').innerHTML=ic('bulb')+'Lời khuyên';
$('#nb-kb').innerHTML=ic('grid')+'Menu';
$('#nb-money').innerHTML=ic('note')+'Nhật ký';
document.querySelector('.fab').innerHTML='<span class="fab-plus">+</span>';

if(weatherLocation)fetchWeather(false);
setInterval(function(){if(weatherLocation&&!document.hidden)fetchWeather(false);},60000);
/* Không yêu cầu nhập tên người ghi. */

function startLocal(){mode='local';buys=buyRead();crops=lsRead();Object.keys(crops).forEach(function(k){crops[k].id=k;});loaded=true;render();}
var cu=window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null);
cu.then(function(db){
  if(!db){startLocal();return;}
  dbh=db;mode='cloud';
  db.collection('purchases').onSnapshot(function(sn){var m2={};sn.docs.forEach(function(d){var o=d.data();o.id=d.id;m2[d.id]=o;});buys=m2;render();},function(){});
  var timer=setTimeout(function(){if(!loaded){loaded=true;render();}},4000);
  db.collection('crops').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){var o=d.data();o.id=d.id;m[d.id]=o;});
    crops=m;
    if(!snap.metadata.fromCache||snap.size>0){loaded=true;clearTimeout(timer);}
    render();
  },function(){startLocal();dbh=null;});
}).catch(function(){startLocal();});
})();

document.addEventListener('input',function(ev){
 if(ev.target&&ev.target.getAttribute('data-role')==='newssearch'){

  var next=document.querySelector('[data-role="newssearch"]');
  if(next){next.focus();try{next.setSelectionRange(start,end);}catch(e){}}
 }
});

 var el=ev.target;if(el&&el.getAttribute('data-role')==='kb-search'){

   var n=document.querySelector('[data-role="kb-search"]');if(n){n.focus();try{n.setSelectionRange(start,end);}catch(e){}}
 }
