/* ===== UX/UI THEO ẢNH THAM CHIẾU — màn hình ao / bottom sheet ===== */
:root{--bg:#f8fafc;--surface:#fff;--ink:#192638;--ink2:#718096;--line:#e3eaf0;--accent:#078bd0;--accent-ink:#fff;--surface2:#eef5f9;--shadow:0 5px 18px rgba(26,56,83,.045)}
body{background:#f9fbfd;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);padding-inline:18px}
#app{max-width:560px;gap:22px;padding-top:23px}
.top{align-items:center}.top h1{font-size:26px}.top .eyebrow{font-size:13px}
.card{border:1px solid #e4ebf0;border-radius:19px;box-shadow:0 3px 12px rgba(27,48,71,.035)}
.back{font-size:15px;margin-bottom:-8px;color:#008ed2;min-height:45px}
.reference-hero{background:linear-gradient(120deg,#16a5e6 0%,#0089d1 58%,#0b83c8 100%);border:0;border-radius:23px;padding:22px 19px 20px;box-shadow:0 10px 25px rgba(2,137,205,.17);color:#fff}
.reference-hero .hero-top{display:flex;flex-wrap:nowrap;align-items:flex-start;gap:10px;justify-content:space-between;padding-bottom:19px;border-bottom:1px solid rgba(255,255,255,.25)}
.reference-hero .hero-main{min-width:0;flex:1}.reference-hero h1{font-size:27px;line-height:1.3;font-weight:700;white-space:nowrap}.reference-hero h1 small{font-size:18px;vertical-align:top;margin-left:2px}
.reference-hero .sub{color:rgba(255,255,255,.89)!important;font-size:12px;line-height:1.7;margin-top:2px}
.hero-day{text-align:center;display:flex;flex-direction:column;flex:none}.hero-day strong{font-size:29px;letter-spacing:-.05em;line-height:1.16}.hero-day span{font-size:10px;font-weight:700;margin-top:4px}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:19px}
.hero-stats>div{min-width:0;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.095);border-radius:14px;padding:13px 11px;display:flex;flex-direction:column;gap:5px}
.hero-stats span{color:rgba(255,255,255,.89);font-size:12px;line-height:1.4}.hero-stats b{font-family:var(--font-display);font-size:18px;white-space:nowrap;color:#fff}
.reference-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.ref-action{background:#fff;border:1px solid #e5ebf0;border-radius:17px;min-width:0;min-height:100px;padding:12px 2px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:11px;font-size:12px;font-weight:700;color:#354358;box-shadow:0 2px 6px rgba(0,0,0,.025)}
.ref-action-icon{display:grid;place-items:center;color:var(--k,#008dd4)}.ref-action-icon svg{width:28px;height:28px;stroke-width:2}
.ref-journal{gap:10px}.ref-journal h2{font-size:19px;letter-spacing:-.025em}.ref-journal .day{padding:6px 0 0;font-size:11px;color:#8b9cac}
.ref-journal .log{border-radius:17px;padding:16px 14px;align-items:center;gap:12px;box-shadow:0 2px 9px rgba(30,50,70,.025);margin:0}
.ref-journal .log .tag{width:42px;height:42px;min-width:42px;display:flex;align-items:center;justify-content:center;font-size:0;border-radius:12px;margin:0}
.ref-journal .log .tag .si{width:23px;height:23px;margin:0}.ref-journal .log .tx{font-size:13px;font-weight:650;line-height:1.5}.ref-journal .log .tx small{font-size:11px;font-weight:400;color:#9aa6b5;margin-top:4px}.ref-journal .log .av{display:none}.ref-journal .log .del{font-size:11px}
.more-details{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.more-details summary{cursor:pointer;list-style:none;padding:15px;font-weight:700;display:flex;align-items:center;gap:8px;font-size:13px}.more-details summary::-webkit-details-marker{display:none}.more-details summary>span{margin-left:auto;font-size:20px}.more-details .details-inside{padding:0 12px 12px}.more-details .grid2{border-radius:12px}
#sheet{align-items:flex-end}#sheet .scrim{background:rgba(24,38,60,.44);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#sheet .panel{border-radius:26px 26px 0 0;background:#fff;max-height:min(88dvh,940px);padding:25px 20px calc(25px + env(safe-area-inset-bottom));gap:16px}
.panel:before{display:none}.panel-h{padding-bottom:15px;border-bottom:1px solid #edf0f5}.panel-h h2{font-size:22px;font-weight:700;letter-spacing:-.04em}.panel-h .eyebrow{font-size:11px;margin-bottom:4px}.panel-h .x{background:#f2f5f9;font-size:24px;width:39px;height:39px;color:#718095}
.fld>label,.fld>.lab{font-size:13px;color:#526174}.inp{background:#f9fafb;border:1px solid #cfd9e2;min-height:51px;border-radius:12px}.inp input{font-size:16px}.fgrid{gap:10px}.cta{background:#078bd0;border-radius:13px;box-shadow:0 5px 12px rgba(0,137,210,.12)}
nav{background:rgba(255,255,255,.98);border-top:1px solid #e7edf2;box-shadow:0 -5px 20px rgba(20,35,55,.035)}.nb{color:#76879f}.nb.on{color:#078bd0}.fab{background:linear-gradient(135deg,#0aa5e4,#006eaf)}
#bk{background:#fff;border:1px solid #e9eef3;border-radius:18px;padding:16px!important;margin-top:16px!important}
@media(max-width:380px){body{padding-inline:12px}.reference-hero{padding:17px 13px}.reference-hero h1{font-size:23px}.hero-stats b{font-size:15px}.ref-action{font-size:11px;min-height:88px}.ref-action-icon svg{width:23px;height:23px}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f8fafc;--surface:#fff;--ink:#192638;--ink2:#718096;--line:#e3eaf0;--accent:#078bd0;--accent-ink:#fff;--surface2:#eef5f9;color-scheme:light}}

/* Vật tư nhập hàng: chọn nhanh, ảnh */
.photo-file{font:inherit;max-width:100%;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--bg)}
.photo-preview{width:90px;height:90px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.bline{gap:10px}.bline .hint{font-size:12px}
/* Thông số ao gọn, dễ đọc trên điện thoại */
.pond-spec{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--ink2);font-size:12px;line-height:1.5}
.pond-spec span{display:inline-flex;align-items:center;padding:4px 8px;border-radius:8px;background:var(--surface2)}
.detail-spec{margin:8px 0 14px}
.hero .pond-spec span{background:rgba(255,255,255,.15);color:#fff}
#pond-editor .lab{font-weight:700}
/* Thời tiết cho ao nuôi */
.weather-card{padding:16px;display:flex;flex-direction:column;gap:12px}
.weather-head,.weather-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.weather-head h2{font-size:18px}.weather-head small,.weather-muted{color:var(--ink2);font-size:12px}
.weather-now{display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-radius:16px;padding:14px}
.weather-temp{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1.1}
.weather-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.weather-stat{background:var(--bg);padding:10px 8px;border-radius:12px;min-width:0}
.weather-stat small{display:block;color:var(--ink2);font-size:11px}.weather-stat b{font-size:15px}
.weather-alert{padding:11px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 13%,var(--surface));border-left:4px solid var(--warn);font-size:13px}
.weather-alert strong{display:block}.weather-alert.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.weather-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.weather-controls input{flex:1 1 145px;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink);font-size:14px}
.weather-controls button{font:inherit;font-size:13px;min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.weather-controls .primary{background:var(--accent);color:var(--accent-ink);border:0}
@media(max-width:380px){.weather-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== Tối ưu thẻ ao đang nuôi: gọn và đẹp mắt hơn ===== */
.pond.pond-compact{border:1px solid var(--line)!important;border-left-width:1px!important;border-radius:24px;box-shadow:0 10px 26px -22px rgba(11,37,64,.28);overflow:hidden}
.pond.pond-compact.st-good{border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.pond.pond-compact.st-warn{border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.pond.pond-compact.st-bad{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.pond-compact .pond-open{padding:0}
.pond-compact .pond-head{padding:16px 16px 8px;display:flex;align-items:flex-start;gap:12px}
.pond-iconbox{width:52px;height:52px;border-radius:15px;background:linear-gradient(180deg,var(--surface2),color-mix(in srgb,var(--surface2) 65%,#fff));display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line)}
.pond-compact .pondsvg{width:30px;height:24px;padding:0;background:none}
.pond-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pond-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pond-title-row h2{font-size:18px;line-height:1.15;margin:0}
.pond-day{flex:none;background:#EEF5FB;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 18%,var(--line));padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pond-meta{font-size:13px;color:var(--ink2);line-height:1.45}
.pond-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pond-compact .stt{padding:5px 10px;border-radius:999px;font-size:12px}
.pond-compact .pond-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
.pond-spec-grid{display:flex;flex-wrap:wrap;gap:7px}
.pond-spec-grid span{display:inline-flex;align-items:center;padding:6px 10px;background:var(--surface2);border-radius:10px;font-size:12px;color:var(--ink2)}
.pond-kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pond-kpi-card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:11px 10px 10px;min-width:0}
.pond-kpi-card .label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px;margin-bottom:6px}
.pond-kpi-card .label .si{width:14px;height:14px;margin:0}
.pond-kpi-card b{display:block;font-family:var(--font-display);font-size:19px;line-height:1.05;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pond-kpi-card b small{font-family:var(--font-body);font-size:11px;font-weight:500;color:var(--ink2);margin-left:2px}
.pond-water-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pond-water-cell{background:var(--surface2);border-radius:12px;padding:8px 10px;min-width:0;border:1px solid transparent}
.pond-water-cell.good{border-color:color-mix(in srgb,var(--good) 22%,transparent)}
.pond-water-cell.warn{border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.pond-water-cell.bad{border-color:color-mix(in srgb,var(--bad) 28%,transparent)}
.pond-water-cell.none{opacity:.88}
.pond-water-cell .topline{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);margin-bottom:4px}
.pond-water-cell .topline .si{width:14px;height:14px;margin:0}
.pond-water-cell b{font-family:var(--font-display);font-size:17px;line-height:1.05;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pond-water-cell b small{font-family:var(--font-body);font-size:11px;font-weight:500;color:var(--ink2);margin-left:2px}
.pond-feed-card{padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--surface2) 65%,#fff),var(--surface))}
.pond-feed-line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;margin-bottom:8px}

/* ===== Rà soát UX/UI tổng quan ===== */
body{padding-bottom:128px}
nav{background:rgba(255,255,255,.985)!important;border-top:1px solid #E3EAF1!important;box-shadow:0 -8px 28px rgba(17,40,64,.06)!important;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))!important;z-index:12}
nav .in{max-width:620px!important;grid-template-columns:1fr 1fr 72px 1fr 1fr!important;gap:6px!important}
.nb{min-height:56px!important;border-radius:14px!important;color:#72869A!important;gap:4px!important}
.nb svg{width:22px!important;height:22px!important}
.nb.on{background:#EEF5FB!important;color:#0B86CC!important}
.fab{width:64px!important;height:64px!important;border-radius:50%!important;border:4px solid var(--bg)!important;background:linear-gradient(135deg,#0AA5E4,#006EAF)!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;margin-top:-24px!important;box-shadow:0 14px 26px -12px rgba(0,95,160,.45)!important;overflow:hidden}
.fab-plus{display:inline-block;font-size:38px;font-weight:500;line-height:1;color:#fff;transform:translateY(-1px)}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.section-counter{background:var(--surface2);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink2)}
.weather-card{padding:16px 16px 14px;border-radius:22px}
.weather-head{align-items:flex-start}
.weather-head h2{font-size:18px;line-height:1.2;margin:0}.weather-sub{margin-top:3px;color:var(--ink2);font-size:12px}
.weather-now{padding:15px 14px;border:1px solid color-mix(in srgb,var(--accent) 12%,var(--line));border-radius:18px}
.weather-grid{gap:10px}.weather-stat{padding:11px 10px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.weather-alert{border-radius:14px;padding:12px 13px;font-size:13px;line-height:1.5}
.weather-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.weather-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:999px;font-size:13px;font-weight:600;max-width:100%}
.weather-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weather-tools{display:flex;gap:8px;flex-wrap:wrap}
.weather-btn{min-height:40px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:13px;font-weight:700;color:var(--ink)}
.weather-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.weather-form-shell{padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.weather-form-shell .weather-controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
.weather-controls input{height:46px;border-radius:12px!important}.weather-inline-note{font-size:12px;color:var(--ink2)}
.pond-compact .pond-quick{gap:12px!important}.pond-compact .qa{min-height:52px!important;border-radius:16px!important;font-size:16px!important;font-weight:800!important;position:relative;overflow:hidden}
.pond-compact .qa svg{width:20px!important;height:20px!important}
.pond-compact .qa.feed-btn{background:linear-gradient(180deg,#FFF8F0,#FFF)!important;border:1.5px solid #F0D2AF!important;color:#C96B09!important;box-shadow:0 6px 16px -14px rgba(201,107,9,.45)}
.pond-compact .qa.feed-btn svg{color:#C96B09!important}.pond-compact .qa.water-btn{background:linear-gradient(180deg,#F5FBFF,#FFF)!important;border:1.5px solid #CDE8F9!important;color:#0B86CC!important;box-shadow:0 6px 16px -14px rgba(11,134,204,.45)}
.pond-compact .qa.water-btn svg{color:#0B86CC!important}.pond-compact .qa.done{background:linear-gradient(180deg,#F1FBF6,#FFF)!important;border-color:#BFE5CF!important;color:var(--good)!important}
.pond-compact .qa.done svg{color:var(--good)!important}
.add-pond-btn{display:flex!important;align-items:center;justify-content:center;gap:10px;min-height:58px!important;border-radius:19px!important;background:linear-gradient(135deg,#089BE1,#066EAF)!important;color:#fff!important;font-size:17px!important;font-weight:800!important;box-shadow:0 14px 28px -18px rgba(5,102,170,.45)}
.add-pond-btn .add-pond-plus{font-size:22px;line-height:1;color:#fff;font-weight:700}
.priority-section .link{font-size:14px}#bk{padding-bottom:6px}
@media(max-width:390px){nav .in{grid-template-columns:1fr 1fr 68px 1fr 1fr!important}.fab{width:60px!important;height:60px!important}.weather-form-shell .weather-controls{grid-template-columns:1fr 1fr;}.weather-form-shell .weather-controls input{grid-column:1 / -1}.pond-compact .qa{font-size:15px!important}}


/* Menu quản lý dạng trung tâm, tối ưu màn hình nhỏ */
.menu-top{margin-bottom:3px}
.menu-welcome{padding:16px 18px;border-radius:18px;background:linear-gradient(120deg,#077CA8,#0C9DAB);color:#fff;display:flex;flex-direction:column;gap:4px}
.menu-welcome b{font-size:18px}.menu-welcome span{font-size:13px;opacity:.92}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-tile{display:flex;align-items:flex-start;flex-direction:column;position:relative;gap:9px;padding:16px;text-align:left;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;color:var(--ink);min-height:126px}

.menu-chevron{position:absolute;right:14px;top:16px;color:var(--ink2);font-size:24px}
.menu-list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 15px;min-width:0}
.menu-item-body{flex:1;min-width:0}.menu-list-item b{display:block;overflow-wrap:anywhere}.menu-list-item small{display:block;color:var(--ink2);font-size:12px;margin-top:4px}
.menu-edit{border:1px solid color-mix(in srgb,var(--accent) 32%,var(--line));border-radius:11px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:var(--accent);padding:10px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.menu-primary{margin-bottom:5px}.stock-positive{color:var(--good);white-space:nowrap}.stock-negative{color:var(--bad);white-space:nowrap}
.menu-item-side{display:flex;align-items:flex-end;flex-direction:column;gap:4px}
@media(max-width:360px){.menu-grid{gap:9px}.menu-tile{padding:12px;min-height:123px}.menu-tile-text b{font-size:14px}}


/* Danh mục hai cột và thao tác nhỏ gọn */
.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.product-grid .menu-list-item{min-width:0;min-height:120px;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;padding:13px;gap:12px;border-radius:16px}
.product-grid .menu-item-body{min-width:0}.product-grid .menu-item-body b{font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.product-grid .menu-item-body small{font-size:11px;line-height:1.5}
.menu-edit{display:inline-flex!important;align-items:center;justify-content:center;align-self:flex-end;gap:4px;border-radius:9px!important;padding:5px 9px!important;font-size:11px!important;min-height:28px;min-width:62px;line-height:1.15}

/* Danh mục sản phẩm và thao tác dùng ngay trên sản phẩm */
.product-category{display:flex;flex-direction:column;gap:10px;margin:12px 0 18px}
.product-category h3{font-size:16px;display:flex;align-items:center;gap:8px}
.product-category h3 small{font:600 12px var(--font-body);color:var(--ink2)}
.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.product-tile{padding:11px;display:flex;flex-direction:column;gap:6px;min-width:0;border-radius:17px}
.product-photo{width:100%;height:112px;object-fit:cover;border-radius:12px;background:var(--surface2)}
.product-placeholder{display:grid;place-items:center;font-size:34px}

.product-tile>small{font-size:12px;color:var(--ink2)}

.product-actions button{flex:1;min-width:0;min-height:36px;padding:5px 3px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font:700 12px var(--font-body);color:var(--ink)}
.product-actions button:last-child{color:#087FB8;background:#EAF6FC;border-color:#C8E7F7}
.product-upload-preview{max-width:130px;max-height:110px;object-fit:contain;border-radius:10px;border:1px solid var(--line)}

/* Thông tin quan trọng trên thẻ sản phẩm */
.product-tile .product-price,.product-tile .product-balance{display:flex;justify-content:space-between;align-items:flex-start;gap:5px;padding:6px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.35}
.product-tile .product-price>span,.product-tile .product-balance>span{color:var(--ink2);font-weight:500;white-space:nowrap}
.product-tile .product-price strong,.product-tile .product-balance strong{text-align:right;overflow-wrap:anywhere;font-size:12px;color:var(--ink)}
.product-tile .product-balance strong{color:var(--good)}
.product-tile .product-price small{font-weight:500;font-size:11px;color:var(--ink2)}
.product-tile>b{min-height:38px;display:block}

/* ===== UX nâng cấp: ao đang nuôi nổi bật, dropdown gọn, lọc sản phẩm ===== */
.pond-live{border:1.5px solid color-mix(in srgb,var(--accent) 24%,var(--line))!important;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 4%,var(--surface)),var(--surface));box-shadow:0 16px 34px -24px rgba(6,126,148,.28)!important}
.pond-live .pond-head{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,transparent),transparent)}
.pond-section-group{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.pond-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.pond-section-title h3{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.pond-section-title small{font-size:12px;color:var(--ink2)}
.pond-highlight-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#EAF8F7;color:var(--accent);font-size:12px;font-weight:700}
.pond-collapse{margin:0 16px 14px;border:1px solid var(--line);border-radius:15px;background:var(--bg);overflow:hidden}
.pond-collapse summary{list-style:none;cursor:pointer;padding:12px 13px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink)}
.pond-collapse summary::-webkit-details-marker{display:none}
.pond-collapse summary span{margin-left:auto;font-size:18px;line-height:1;color:var(--ink2);transition:transform .18s ease}
.pond-collapse[open] summary span{transform:rotate(180deg)}
.pond-collapse-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.product-filter-wrap{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.product-filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.filter-chipline{display:flex;gap:8px;flex-wrap:wrap}
.filter-chip{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:12px;color:var(--ink2);font-weight:600}
@media(max-width:390px){.product-filter-grid{grid-template-columns:1fr}.pond-collapse{margin:0 14px 12px}}


/* Bộ lọc sản phẩm gọn trong một nút */
.product-list-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.product-list-toolbar h2{font-size:18px;margin:0}.product-list-toolbar h2 small{font-size:12px;color:var(--ink2);font-weight:500}
.filter-trigger{display:inline-flex;gap:7px;align-items:center;justify-content:center;padding:9px 15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;font-weight:700;font-size:13px}
.filter-trigger.opened{background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.filter-trigger .si{margin:0;width:16px;height:16px}
.product-filter-panel{display:grid;gap:10px;margin:10px 0 15px;padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--surface)}
.product-filter-panel .inp{background:var(--bg)}.product-filter-panel input,.product-filter-panel select{font-size:14px}
.filter-clear{justify-self:end;border:0;background:transparent;font:600 12px var(--font-body);color:var(--accent);padding:4px}
.product-delete-button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 6%,var(--surface));color:var(--bad);border-radius:12px;font:600 13px var(--font-body)}
.product-delete-button .si{width:15px;height:15px;margin:0}


/* Báo cáo tổng hợp quản lý ao nuôi */
.report-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.report-controls .fld{font-weight:600;font-size:13px;color:var(--ink2)}
.report-controls select{width:100%;font-weight:600}
.report-tabs{display:flex;gap:7px;overflow-x:auto;white-space:nowrap;padding:4px 0 9px;scrollbar-width:thin}
.report-tabs button{flex:none;min-height:39px;padding:0 13px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:12px;font-size:13px;font-weight:700}
.report-tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.report-summary{background:linear-gradient(120deg,#075e81,#0b98a3);color:white;border-radius:20px;padding:19px;display:flex;flex-direction:column;gap:5px}
.report-summary small{color:#dcf9fc}.report-summary strong{font-size:30px;letter-spacing:-.035em}.report-summary span{font-size:12px;color:#e0f2f6}
.report-summary .loss{color:#ffe0e5}.report-summary .gain{color:#e9fff0}
.report-metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.report-metric{display:flex;flex-direction:column;gap:6px;padding:14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.report-metric small{color:var(--ink2);font-size:12px}.report-metric strong{font-size:18px;overflow-wrap:anywhere}.report-metric em{font-size:11px;color:var(--ink2)}
.report-box{padding:14px 15px;display:flex;flex-direction:column;gap:8px}.report-box h3{font-size:16px;margin:0 0 3px}
.report-line{padding:11px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px}
.report-line div{flex:1;min-width:0}.report-line b{overflow-wrap:anywhere}.report-line small{display:block;font-size:11px;color:var(--ink2);margin-top:4px}
.report-line strong{text-align:right;white-space:nowrap}.report-line .gain{color:var(--good)}.report-line .loss{color:var(--bad)}
.report-cost{display:flex;flex-direction:column;gap:7px;padding:8px 0}.report-cost>div:first-child{display:flex;justify-content:space-between;gap:12px;font-size:13px}.report-track{height:7px;border-radius:10px;background:var(--surface2);overflow:hidden}.report-track i{display:block;height:100%;background:var(--accent);border-radius:10px}
.report-hint{color:var(--ink2);font-size:12px;line-height:1.6;margin:2px 0}
@media(max-width:350px){.report-controls{grid-template-columns:1fr}.report-metric strong{font-size:16px}}

.product-management-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 15px}
.product-manage-btn,.product-add-small{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;min-height:38px;padding:0 12px;font-weight:700;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.product-manage-btn{background:var(--surface);color:var(--ink)}
.product-add-small{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.product-management-bar .si{width:15px;height:15px;margin:0;color:inherit}
.category-add-row{display:flex;align-items:center;gap:8px}
.category-add-row .inp{flex:1;min-width:0}
.category-submit{min-height:48px;padding:0 12px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap}
.category-list{display:flex;flex-direction:column;gap:7px;max-height:45vh;overflow:auto}
.category-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.category-row>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.category-row strong{font-size:13px;overflow-wrap:anywhere}.category-row small{font-size:11px;color:var(--ink2)}
.category-delete{display:inline-flex;align-items:center;gap:5px;border:1px solid color-mix(in srgb,var(--bad) 32%,var(--line));border-radius:9px;background:var(--surface);padding:7px 9px;color:var(--bad);font-size:11px;font-weight:600;white-space:nowrap}
.category-delete .si{width:13px;height:13px;margin:0}
@media(max-width:365px){.product-management-bar{justify-content:stretch}.product-manage-btn,.product-add-small{flex:1;padding:0 7px}}

/* Sao lưu/khôi phục chỉ ở trang Menu chính */

/* Popup thông tin sản phẩm */

/* Nhật ký thay cho Kho vật tư trên thanh điều hướng (Kho vẫn nằm trong Menu) */

.pond-bottom-item{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;border:0;background:transparent;border-radius:12px;min-height:59px;padding:5px 0 4px;color:#547282;font-size:11px;font-weight:700;white-space:nowrap}
.pond-bottom-icon{display:flex;align-items:center;justify-content:center;width:33px;height:32px;border-radius:11px;background:#E8F5F7;color:#087E9A}
.pond-bottom-icon svg{width:21px;height:21px}
.pond-bottom-tasks .pond-bottom-icon{background:#E8F7EF;color:#15845A}
.pond-bottom-reports .pond-bottom-icon{background:#FFF2D8;color:#AB6C17}
.pond-bottom-journal .pond-bottom-icon{background:#EEE9FA;color:#7956B1}
.pond-bottom-item.selected{background:#F2F8FA;color:#17394B}
.pond-bottom-item.selected .pond-bottom-icon{box-shadow:inset 0 0 0 1px currentColor}


/* Chi tiết ao: cài đặt ưu tiên đầu trang và thống kê trong popup */
.pond-settings-top{display:flex;flex-direction:column;gap:10px;margin:2px 0 3px}
.pond-settings-label{display:flex;align-items:center;gap:6px;color:#526579;font-size:11px;font-weight:800;letter-spacing:.07em}
.pond-settings-label .si{width:16px;height:16px;margin:0;color:#66829B}
.pond-setting-row.pond-setting-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.pond-setting-cards button{min-width:0;min-height:73px!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;text-align:left!important;gap:9px!important;padding:12px 10px!important;background:#F1F6FA!important;border:1px solid #DCE7ED!important;border-radius:15px!important;color:#1B4054!important;box-shadow:none!important}
.pond-setting-cards button>span:nth-child(2){display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:750;line-height:1.3;min-width:0}
.pond-setting-cards button small{font-size:10px;font-weight:500;color:#658092}
.pond-setting-cards .ps-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:#DFEBF4;color:#227D9B}
.pond-setting-cards .ps-icon .si{margin:0;width:17px;height:17px}
.pond-setting-cards button:nth-child(2) .ps-icon{background:#E5F4E9;color:#30875B}
.pond-setting-cards .ps-chevron{margin-left:auto;opacity:.55;font-size:19px}
.pond-stat-open{width:100%;display:flex;align-items:center;gap:8px;justify-content:flex-start;padding:13px 14px;border:1px solid #CFE5EC;border-radius:14px;background:#EAF6F9;color:#16677E;font-size:13px;font-weight:750;text-align:left}
.pond-stat-open .si{width:18px;height:18px;margin:0}
.pond-stat-open span:last-child{margin-left:auto;font-size:23px;font-weight:400}
.pond-stat-popup{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.pond-stat-popup-title{display:flex;gap:7px;align-items:center;font-size:14px;font-weight:800;margin-top:8px;color:#183D50}
.pond-stat-popup-title .si{width:17px;height:17px;margin:0}
.pond-stat-popup .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.pond-stat-popup .cell{background:#F1F7FA;border-radius:12px;padding:11px;min-width:0}
.pond-stat-facts{display:grid;grid-template-columns:1fr auto;gap:11px;background:#F2F7FA;border-radius:13px;padding:13px;font-size:12px}
.pond-stat-facts span{color:#607585}.pond-stat-facts b{text-align:right;color:#17394B}
@media(max-width:390px){.pond-setting-cards button{padding:10px 7px!important;gap:6px!important}.pond-setting-cards .ps-chevron{display:none}.pond-setting-cards .ps-icon{width:27px;height:27px}}

</style>
</head>
<body>
<title>Sổ Ao Tôm</title>
<meta name="theme-color" content="#0B7FC0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Ao Tôm">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Bố cục: một cột kiểu app điện thoại. Thẻ ao có kích thước hình ao vẽ theo đúng tỉ lệ diện tích 300 / 500 / 900 m². Thanh điều hướng dưới cùng, nút Ghi nhanh ở giữa. */
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --surface2:#E2EAF2; --ink:#0B2540; --ink2:#55697D; --line:#D6E0EA;
  --accent:#0B7FC0; --accent-ink:#FFFFFF; --water:#B7DDF0; --water2:#4AA3D1;
  --coral:#0F4C81; --coral-ink:#FFFFFF; --coral-d:#0F4C81;
  --good:#1B7F4C; --warn:#9A5A08; --bad:#C4332F; --p1:#6B4FBB;
  --shadow:0 1px 2px rgb(11 37 64/.06),0 12px 28px -16px rgb(11 37 64/.25);
  --font-display:'Lexend','Be Vietnam Pro',system-ui,sans-serif;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07162A; --surface:#0E2540; --surface2:#16365A; --ink:#E6F1FA; --ink2:#8FA9C0; --line:#1F4268;
    --accent:#4FB8F0; --accent-ink:#04203A; --water:#134A72; --water2:#2B86B8;
    --coral:#8AC8FF; --coral-ink:#04203A; --coral-d:#9FD4FF;
    --good:#4CD08F; --warn:#F0B84F; --bad:#FF7F8E; --p1:#B9A2F2; --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 24px -14px rgb(0 0 0/.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07162A; --surface:#0E2540; --surface2:#16365A; --ink:#E6F1FA; --ink2:#8FA9C0; --line:#1F4268;
  --accent:#4FB8F0; --accent-ink:#04203A; --water:#134A72; --water2:#2B86B8;
  --coral:#8AC8FF; --coral-ink:#04203A; --coral-d:#9FD4FF;
  --good:#4CD08F; --warn:#F0B84F; --bad:#FF7F8E; --p1:#B9A2F2; --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 24px -14px rgb(0 0 0/.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 112px;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:20px;padding-top:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.02em;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:26px;line-height:1.1;font-weight:700;white-space:nowrap}
.sync{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.sync.loc i{background:var(--warn)}
.section{display:flex;flex-direction:column;gap:10px}
.section>h2{font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}

/* biểu tượng */
.si{width:14px;height:14px;vertical-align:-2px;margin-right:5px;flex:none}
.kpi span,.cell span,.wcell span{display:flex;align-items:center}
.kpi span .si,.cell span .si,.wcell span .si{color:var(--accent)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;border-radius:15px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--accent) 80%,#000)}
.logo svg{width:32px;height:32px}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h .si{width:20px;height:20px;margin:0;color:var(--accent)}
.pill .si{width:13px;height:13px;margin-right:4px;vertical-align:-2px}
.tag .si{width:12px;height:12px;margin-right:3px;vertical-align:-2px}
.alert .ai{flex:none;margin-top:1px}.alert .ai .si{width:20px;height:20px;margin:0}
.alert.bad .ai{color:var(--bad)}.alert.warn .ai{color:var(--warn)}.alert.good .ai{color:var(--good)}.alert.info .ai{color:var(--accent)}
.barlab span:first-child{display:flex;align-items:center}
/* cảnh báo */
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;text-align:left}
.alert .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ink2)}
.alert.bad .dot{background:var(--bad)} .alert.warn .dot{background:var(--warn)} .alert.good .dot{background:var(--good)}
.alert b{font-weight:600}
.alert small{display:block;color:var(--ink2);font-size:13px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--ink2);font-size:14px}

/* thẻ ao */
.pond{overflow:hidden;display:flex;flex-direction:column;width:100%;text-align:left;padding:0}
.pond-head{display:flex;align-items:center;gap:14px;padding:14px 14px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--water) 50%,var(--surface)),var(--surface))}
.pondsvg{width:64px;height:44px;flex:none}
.pondsvg .pw{fill:var(--water);stroke:var(--water2);stroke-width:1.5}
.pondsvg .pw.off{fill:none;stroke-dasharray:3 3}
.pondsvg .rip{fill:none;stroke:var(--surface);stroke-width:1.3;stroke-linecap:round;opacity:.8}
.pond-head h2{font-size:22px;line-height:1.1}
.pond-head .sub{color:var(--ink2);font-size:13px}
.pill{margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.pond-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi b{font-family:var(--font-display);font-size:20px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.kpi b small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--ink2);margin-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:500;padding:3px 9px;border-radius:8px;display:inline-flex;gap:5px;align-items:center;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.none{background:var(--surface2);color:var(--ink2)}
.chip em{font-style:normal;font-weight:400;opacity:.85}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.barlab{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:5px;gap:8px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.cta.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.cta.block{width:100%}
.cta.danger{background:var(--bad);color:#fff}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600}

/* trang ao */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600;align-self:flex-start}
.hero{padding:16px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--water) 50%,var(--surface)),var(--surface) 75%)}
.hero-top{display:flex;align-items:center;gap:14px}
.hero h1{font-size:30px;line-height:1.05}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cell{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell span{font-size:12px;color:var(--ink2)}
.cell b{font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.2}
.cell b small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--ink2);margin-left:3px}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;min-height:76px}
.act svg{width:24px;height:24px;color:var(--accent)}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wcell{padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.wcell span{font-size:12px;color:var(--ink2)}
.wcell b{font-family:var(--font-display);font-size:20px}
.wcell b small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--ink2);margin-left:3px}
.wcell.warn b{color:var(--warn)} .wcell.bad b{color:var(--bad)} .wcell.good b{color:var(--good)}
.wcell i{font-style:normal;font-size:12px;font-weight:600}
.wcell.warn i{color:var(--warn)} .wcell.bad i{color:var(--bad)} .wcell.good i{color:var(--good)}
.chartbox{padding:12px 12px 8px}
.chartbox h3{font-size:15px;margin-bottom:2px}
.chartbox p{margin:0 0 6px;color:var(--ink2);font-size:13px}
svg.chart{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--ink2);font-size:9.5px;font-family:var(--font-body)}
.chart .tv{fill:var(--ink);font-size:10.5px;font-weight:600;font-family:var(--font-body)}
.chart .ref{fill:none;stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:4 4;opacity:.65}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .br{fill:var(--water2)}
.chart .br.today{fill:var(--accent)}
.chart .rec{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:3 3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:2px 4px 6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend i.d{border-top:2px dashed var(--ink2)} .legend i.w{border-top:2px dashed var(--warn)}

/* nhật ký */
.day{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);padding:12px 2px 6px}
.log{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.tag{flex:none;white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--ink2);min-width:64px;text-align:center;margin-top:1px}
.tag.feed{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.water{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tag.harvest{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.cost{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.log .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.log .tx small{display:block;color:var(--ink2);font-size:12px}
.log .del{background:none;border:0;color:var(--ink2);font-size:12px;padding:2px 4px;flex:none}
.log .confirm{display:flex;gap:8px;flex:none}
.log .confirm button{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px}
.log .confirm .y{background:var(--bad);color:#fff;border-color:var(--bad)}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{padding:11px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hrow b{font-weight:600}.hrow span{color:var(--ink2);font-size:13px}

/* thu chi */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:38px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.tot{padding:16px;display:flex;flex-direction:column;gap:12px}
.tot .big{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.05}
.tot .big.neg{color:var(--bad)} .tot .big.pos{color:var(--good)}
.row3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mrow{padding:14px;display:flex;flex-direction:column;gap:10px}
.mrow-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mrow-h h3{font-size:17px}
.cat{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.cat .bar{height:6px}
.cat span:last-child{color:var(--ink2)}

/* người ghi */
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.who{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px 6px 10px;font-size:13px;font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .si{margin:0;color:var(--accent);width:16px;height:16px}
.av{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);margin-top:1px}
.av.p1{background:color-mix(in srgb,var(--p1) 18%,transparent);color:var(--p1)}
.today{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--ink2)}
.tchip .si{margin-right:4px;width:13px;height:13px}
.tchip.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.dupbox{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink);font-size:14px;border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.lastw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.tag.death{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.tag.treat{background:color-mix(in srgb,var(--p1) 14%,transparent);color:var(--p1)}
/* lời khuyên và cẩm nang */
details.adv{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
details.adv summary{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer}
details.adv summary::-webkit-details-marker{display:none}
details.adv .at{display:flex;flex-direction:column;min-width:0}
details.adv .at small{color:var(--ink2);font-size:13px}
details.adv .ai{flex:none;margin-top:1px}details.adv .ai .si{width:20px;height:20px;margin:0}
details.adv.bad .ai{color:var(--bad)}details.adv.warn .ai{color:var(--warn)}details.adv.good .ai{color:var(--good)}details.adv.info .ai{color:var(--accent)}
.adv-b{padding:0 14px 12px 44px;display:flex;flex-direction:column;gap:8px}
.adv-b ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.adv-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink2);font-size:12px}
.kbcard{display:flex;align-items:center;gap:14px;padding:14px;text-align:left;width:100%;color:inherit}

/* thanh dưới */

/* bảng nhập */

.inp{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px;gap:8px}

.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:528px;margin-inline:auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;z-index:30;text-align:center}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}

/* ===== Giao diện mới: giấy sổ + xanh ngọc + san hô ===== */
body{font-size:16px}

.hero{background:linear-gradient(160deg,#0B8AD0 0%,#075A94 100%);color:#fff;border:0;border-radius:26px;padding:20px 18px}

nav{background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nb{position:relative;font-size:11.5px}

/* ===== Màu theo chức năng + gradient ===== */
:root{
  --lift:0%;
  --k-feed:#C2650A; --k-water:#0B84C9; --k-abw:#7C3AED; --k-treat:#15935F; --k-cost:#D6336C; --k-buy:#0C9488;
  --k-harvest:#4F46E5; --k-death:#6B6560; --k-note:#475569; --k-stock:#E8643C;
  --g-btn:linear-gradient(135deg,#0B7FC0,#095C94);
  --g-fab:linear-gradient(135deg,#1668A8,#0C3F70);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lift:45%;--g-btn:linear-gradient(135deg,#7BD0F8,#3AA8E0);--g-fab:linear-gradient(135deg,#BFE0FF,#7DBEF5)}}
:root[data-theme="dark"]{--lift:45%;--g-btn:linear-gradient(135deg,#7BD0F8,#3AA8E0);--g-fab:linear-gradient(135deg,#BFE0FF,#7DBEF5)}
[data-k=feed]{--kb:var(--k-feed)}[data-k=water]{--kb:var(--k-water)}[data-k=abw]{--kb:var(--k-abw)}[data-k=treat]{--kb:var(--k-treat)}
[data-k=cost]{--kb:var(--k-cost)}[data-k=buy]{--kb:var(--k-buy)}[data-k=harvest]{--kb:var(--k-harvest)}[data-k=death]{--kb:var(--k-death)}[data-k=note]{--kb:var(--k-note)}
[data-k]{--k:color-mix(in srgb,var(--kb),#fff var(--lift))}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 13%,var(--bg)) 0,var(--bg) 340px) no-repeat,var(--bg)}
/* ô chức năng giống ảnh mẫu */
.act[data-k]:not(.pri),.qa[data-k]:not(.done){background:linear-gradient(145deg,color-mix(in srgb,var(--k) 9%,var(--surface)),color-mix(in srgb,var(--k) 24%,var(--surface)));border:1px solid color-mix(in srgb,var(--k) 28%,transparent);color:color-mix(in srgb,var(--k) 72%,var(--ink))}
.act[data-k]:not(.pri) svg,.qa[data-k]:not(.done) svg{color:var(--k)}
.act{font-weight:600}
.act svg{width:28px;height:28px}
.typegrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.act.pri{border:0;color:#fff}
.act.pri svg{color:#fff}
.act.pri[data-k=feed]{background:linear-gradient(135deg,#E08A1E,#B45309)}
.act.pri[data-k=water]{background:linear-gradient(135deg,#1496D8,#075A94)}
.qa.done{background:linear-gradient(145deg,color-mix(in srgb,var(--good) 8%,var(--surface)),color-mix(in srgb,var(--good) 20%,var(--surface)))}
/* nhãn nhật ký theo màu chức năng */
.tag.feed{--t:var(--k-feed)}.tag.water{--t:var(--k-water)}.tag.abw{--t:var(--k-abw)}.tag.treat{--t:var(--k-treat)}.tag.cost{--t:var(--k-cost)}
.tag.harvest{--t:var(--k-harvest)}.tag.death{--t:var(--k-death)}.tag.note{--t:var(--k-note)}.tag.stock{--t:var(--k-stock)}
.tag[class*=" "]{--tt:color-mix(in srgb,var(--t),#fff var(--lift));background:color-mix(in srgb,var(--tt) 16%,transparent);color:color-mix(in srgb,var(--tt) 75%,var(--ink))}
/* biểu tượng nhỏ có màu riêng */
.si.i-feed{--ic:var(--k-feed)}.si.i-water{--ic:var(--k-water)}.si.i-abw{--ic:var(--k-abw)}.si.i-cost{--ic:var(--k-cost)}.si.i-flask{--ic:var(--k-treat)}
.si.i-cart{--ic:var(--k-buy)}.si.i-harvest{--ic:var(--k-harvest)}.si.i-note{--ic:var(--k-note)}.si.i-death{--ic:var(--k-death)}
.si.i-shrimp{--ic:#E8643C}.si.i-grid{--ic:#0891B2}.si.i-heart{--ic:#E11D48}.si.i-trend{--ic:#16A34A}.si.i-gauge{--ic:#7C3AED}
.si.i-thermo{--ic:#EA580C}.si.i-salt{--ic:#0D9488}.si.i-eye{--ic:#6366F1}.si.i-bubbles{--ic:#0EA5E9}.si.i-wind{--ic:#64748B}
.si.i-bell,.si.i-bulb{--ic:#D97706}.si.i-cal{--ic:#2563EB}.si.i-pond{--ic:#0D9488}.si.i-book{--ic:#4F46E5}.si.i-plus{--ic:currentColor}
.kpi span .si,.cell span .si,.wcell span .si,.sec-h .si,.barlab .si{color:color-mix(in srgb,var(--ic,var(--accent)),#fff var(--lift))}

.pond-head{background:linear-gradient(135deg,color-mix(in srgb,var(--water) 60%,var(--surface)),var(--surface) 72%)}
.card.tot{background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface) 62%)}
.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.26),transparent 55%),linear-gradient(160deg,#0B8AD0 0%,#075A94 100%)}

<script>
(function(){
var KEY='aotom.crops.v1',BK='aotom.buy.v1',PK='aotom.ponds.v1',m=document.getElementById('bk-msg');
document.getElementById('bk-save').addEventListener('click',function(){
  var c,b,p;try{c=JSON.parse(localStorage.getItem(KEY)||'{}');b=JSON.parse(localStorage.getItem(BK)||'{}');p=JSON.parse(localStorage.getItem(PK)||'[]');}catch(e){m.textContent='Không đọc được dữ liệu.';return;}
  var extras={};['aotom.suppliers.v1','aotom.products.v1','aotom.issues.v1','aotom.stockreturns.v1','aotom.productcategories.v1','aotom.hiddenproductcategories.v1','aotom.deletedproducts.v1'].forEach(function(k){var v=localStorage.getItem(k);if(v!==null)extras[k]=v;});var d=JSON.stringify({v:4,crops:c,buys:b,ponds:p,extras:extras});
  var a=document.createElement('a'),n=new Date().toISOString().slice(0,10);
  a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download='so-ao-tom-'+n+'.json';
  document.body.appendChild(a);a.click();a.remove();m.textContent='Đã tạo file sao lưu so-ao-tom-'+n+'.json';
});
document.getElementById('bk-file').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o||typeof o!=='object')throw 0;
    if(o.v===4||o.v===3||o.v===2){localStorage.setItem(KEY,JSON.stringify(o.crops||{}));localStorage.setItem(BK,JSON.stringify(o.buys||{}));if(o.v>=3)localStorage.setItem(PK,JSON.stringify(o.ponds||[]));else localStorage.removeItem(PK);if(o.v===4&&o.extras&&typeof o.extras==='object'){Object.keys(o.extras).filter(function(k){return /^aotom\.(suppliers|products|issues|stockreturns|productcategories|hiddenproductcategories|deletedproducts)\.v1$/.test(k);}).forEach(function(k){if(typeof o.extras[k]==='string')localStorage.setItem(k,o.extras[k]);});}}
    else localStorage.setItem(KEY,JSON.stringify(o));
    m.textContent='Đã khôi phục. Đang tải lại…';setTimeout(function(){location.reload();},600);}catch(x){m.textContent='File không đúng định dạng sao lưu.';}};

});

/* ---------- tiện ích ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n,d){if(n==null||isNaN(n))return '—';return Number(n).toLocaleString('vi-VN',{maximumFractionDigits:d||0});}
function p2(n){return (n<10?'0':'')+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function nowTime(){var d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes());}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function dmy(s){var a=s.split('-');return a[2]+'/'+a[1];}
function mny(n){return fmt(Math.round(n))+' đ';}
function mnyS(n){var a=Math.abs(n),s=n<0?'−':'';if(a>=1e9)return s+fmt(a/1e9,2)+' tỷ';if(a>=1e6)return s+fmt(a/1e6,1)+' tr';return s+fmt(a)+' đ';}
function sum(a,f){var t=0;for(var i=0;i<a.length;i++)t+=f(a[i])||0;return t;}
function cmpE(a,b){return (a.d+(a.tm||'')+(a.ts||0)).localeCompare(b.d+(b.tm||'')+(b.ts||0),'en',{numeric:true});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function isNur(c){return !!c&&c.type==='nursery';}
function typeLabel(c){return isNur(c)?'Ao ương':'Thương phẩm';}
function pondOf(id){return PONDS.filter(function(p){return p.id===id;})[0];}

/* ---------- tính toán ---------- */
function interp(d){
  if(d<=0)return REF[0][1];
  for(var i=1;i<REF.length;i++){if(d<=REF[i][0]){var a=REF[i-1],b=REF[i];return a[1]+(b[1]-a[1])*(d-a[0])/(b[0]-a[0]);}}
  return 22+(d-120)*0.15;
}
function feedPct(w){return w<1?10:w<3?6.5:w<6?5:w<10?4:w<15?3.2:w<20?2.7:2.3;}
function wstat(p,v){
  if(p.ok){if(v>=p.ok[0]&&v<=p.ok[1])return {lv:'good',dir:''};var dir=v<p.ok[0]?'thấp':'cao';return {lv:(v>=p.warn[0]&&v<=p.warn[1])?'warn':'bad',dir:dir};}
  if(p.min){if(v>=p.min[0])return {lv:'good',dir:''};return {lv:v>=p.min[1]?'warn':'bad',dir:'thấp'};}
  if(v<=p.max[0])return {lv:'good',dir:''};return {lv:v<=p.max[1]?'warn':'bad',dir:'cao'};
}
function money(c){
  var E=c.entries||[],cost=0,rev=0,hk=0,hn=0,cat={};
  E.forEach(function(e){
    if(e.t==='cost'){cost+=e.amount||0;cat[e.cat]=(cat[e.cat]||0)+(e.amount||0);}
    if(e.t==='harvest'){hk+=e.kg||0;rev+=(e.kg||0)*(e.price||0);hn+=(e.kg||0)*(e.size||0);}
  });
  var xo=sum(c.xfers||[],function(x){return x.cost;}),f=cost>0?Math.max(0,(cost-xo)/cost):1;
  if(xo>0)for(var kk in cat)cat[kk]*=f;
  return {cost:cost-xo,gross:cost,xout:xo,rev:rev,hk:hk,hn:hn,cat:cat,profit:rev-(cost-xo)};
}
function stats(c,p){
  var t=todayStr(),E=(c.entries||[]).slice().sort(cmpE);
  var end=c.status==='done'&&c.endDate?c.endDate:t;
  var doc=Math.max(0,dayDiff(c.stockDate,end));
  var abws=E.filter(function(e){return e.t==='abw';});
  var last=abws[abws.length-1]||null;
  var off=c.ageOff||0,est=interp(doc+off),w=last?last.g:est;
  var surv=last&&last.surv?last.surv/100:0.85;
  var dsum=sum(E.filter(function(e){return e.t==='death'&&(!last||e.d>=last.d);}),function(e){return e.count;});
  surv=Math.max(0.05,surv-dsum/c.qty);
  var m=money(c);
  var biomassAll=c.qty*surv*w/1000;
  var xp=sum(c.xfers||[],function(x){return x.pct;})/100;
  var biomass=Math.max(0,biomassAll*(1-xp)-m.hk);
  var feeds=E.filter(function(e){return e.t==='feed';});
  var totalFeed=sum(feeds,function(e){return e.kg;});
  var fedToday=sum(feeds.filter(function(e){return e.d===t;}),function(e){return e.kg;});
  var rec=c.status==='active'?biomass*feedPct(w)/100:0;
  var adg=null;
  if(abws.length>=2){var a=abws[abws.length-2],b=abws[abws.length-1],dd=dayDiff(a.d,b.d);if(dd>0)adg=(b.g-a.g)/dd;}
  else if(last&&doc>0)adg=last.g/doc;
  var fcrBase=m.hk+(c.status==='active'?biomass:0);
  var surv2=(m.hn&&c.qty)?Math.min(100,m.hn/c.qty*100):null;
  return {doc:doc,age:doc+off,off:off,abws:abws,last:last,w:w,measured:!!last,surv:surv,biomass:biomass,rec:rec,fedToday:fedToday,totalFeed:totalFeed,adg:adg,
    fcr:fcrBase>0&&totalFeed>0?totalFeed/fcrBase:null,m:m,feeds:feeds,E:E,survDone:surv2,density:c.qty/p.area};
}
function latestWater(E){
  var out={},w=E.filter(function(e){return e.t==='water';});
  WP.forEach(function(p){for(var i=w.length-1;i>=0;i--){if(w[i][p.k]!=null){out[p.k]={v:w[i][p.k],d:w[i].d,s:wstat(p,w[i][p.k])};break;}}});
  return out;
}
function alertsFor(c,p,s){
  var t=todayStr(),A=[],lw=latestWater(s.E);
  WP.forEach(function(q){var x=lw[q.k];if(x&&x.s.lv!=='good'&&dayDiff(x.d,t)<=2){
    A.push({lv:x.s.lv,t:q.l+' '+fmt(x.v,q.d)+(q.u?' '+q.u:'')+' '+x.s.dir,s:p.name+(x.d===t?' · hôm nay':' · '+dmy(x.d))+(q.k==='do'?' · chạy thêm quạt, giảm ăn':q.k==='ph'?' · xem lời khuyên':'')});}});
  if(!s.E.some(function(e){return e.t==='water'&&e.d===t;}))A.push({lv:'info',t:'Chưa đo nước hôm nay',s:p.name});
  if(s.rec>0&&s.fedToday<s.rec*0.5&&new Date().getHours()>=12)A.push({lv:'info',t:'Mới cho ăn '+fmt(s.fedToday,1)+' / '+fmt(s.rec,1)+' kg gợi ý',s:p.name});
  var lastAbwD=s.last?s.last.d:null;
  if(s.doc>=20&&(!lastAbwD||dayDiff(lastAbwD,t)>=10))A.push({lv:'info',t:lastAbwD?'Đã '+dayDiff(lastAbwD,t)+' ngày chưa cân mẫu':'Chưa cân mẫu lần nào',s:p.name});
  if(isNur(c)&&c.status==='active'&&s.doc>=25)A.push({lv:'info',t:'Ao ương đã ngày '+s.doc+', xem xét chuyển ao',s:p.name+' · bấm Chuyển ao khi sẵn sàng'});
  if(s.measured&&s.w>=16.7)A.push({lv:'good',t:'Tôm cỡ '+fmt(1000/s.w)+' con/kg, có thể tính thu hoạch',s:p.name});
  var order={bad:0,warn:1,info:2,good:3};
  return A.sort(function(a,b){return order[a.lv]-order[b.lv];});
}

function pondSvg(area,on){
  var k=Math.sqrt(area/900),w=60*k,h=40*k,x=(64-w)/2,y=(44-h)/2;
  var sc=Math.min(h-6,20)/24,rip=on?'<g transform="translate('+(32-12*sc)+' '+(22-12*sc)+') scale('+sc+')" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICON.shrimp+'</g>':'';
  return '<svg class="pondsvg" viewBox="0 0 64 44" aria-hidden="true"><rect class="pw'+(on?'':' off')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="5"/>'+rip+'</svg>';
}
function abwChart(c,s){
  var W=320,H=160,L=30,R=14,T=16,B=22;
  var off=c.ageOff||0,maxD=Math.max(120,s.doc+off+10);maxD=Math.ceil(maxD/30)*30;
  var pts=s.abws.map(function(e){return [dayDiff(c.stockDate,e.d)+off,e.g];});
  var mg=24;pts.forEach(function(q){if(q[1]*1.15>mg)mg=q[1]*1.15;});
  var step=mg>40?20:10;mg=Math.ceil(mg/step)*step;
  function X(d){return L+(W-L-R)*d/maxD;}function Y(g){return T+(H-T-B)*(1-g/mg);}
  var o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ trọng lượng tôm theo ngày nuôi">';
  for(var g=0;g<=mg;g+=step)o+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'"/><text class="tx" x="'+(L-5)+'" y="'+(Y(g)+3)+'" text-anchor="end">'+g+'</text>';
  for(var d=0;d<=maxD;d+=30)o+='<text class="tx" x="'+X(d)+'" y="'+(H-6)+'" text-anchor="middle">'+d+'</text>';
  var r=REF.filter(function(q){return q[0]<=maxD&&q[1]<=mg;}).map(function(q){return X(q[0])+','+Y(q[1]);}).join(' ');
  o+='<polyline class="ref" points="'+r+'"/>';
  if(c.status==='active')o+='<line class="rec" x1="'+X(s.doc+off)+'" x2="'+X(s.doc+off)+'" y1="'+T+'" y2="'+(H-B)+'"/>';
  if(pts.length){
    o+='<polyline class="ln" points="'+pts.map(function(q){return X(q[0])+','+Y(q[1]);}).join(' ')+'"/>';
    pts.forEach(function(q){o+='<circle class="pt" cx="'+X(q[0])+'" cy="'+Y(q[1])+'" r="4"/>';});
    var l=pts[pts.length-1],lx=X(l[0]);o+='<text class="tv" x="'+Math.min(lx,W-R-12)+'" y="'+(Y(l[1])-9)+'" text-anchor="middle">'+fmt(l[1],1)+' g</text>';
  }else o+='<text class="tx" x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle">Chưa có lần cân mẫu nào</text>';
  return o+'</svg>';
}
function feedChart(c,s){
  var W=320,H=120,L=8,R=8,T=18,B=18,n=14,t=todayStr(),days=[],mx=s.rec||1;
  for(var i=n-1;i>=0;i--){var d=addDays(t,-i);var v=sum(s.feeds.filter(function(e){return e.d===d;}),function(e){return e.kg;});days.push({d:d,v:v});if(v>mx)mx=v;}
  mx*=1.15;
  var bw=(W-L-R)/n;function Y(v){return T+(H-T-B)*(1-v/mx);}
  var o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Lượng thức ăn 14 ngày gần nhất">';
  o+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'"/>';
  days.forEach(function(x,i){
    var bx=L+i*bw+bw*0.18,w=bw*0.64,top=Y(x.v),isT=x.d===t;
    if(x.v>0)o+='<rect class="br'+(isT?' today':'')+'" x="'+bx+'" y="'+top+'" width="'+w+'" height="'+(H-B-top)+'" rx="3"/>';
    if(isT&&x.v>0)o+='<text class="tv" x="'+(bx+w/2)+'" y="'+(top-4)+'" text-anchor="middle">'+fmt(x.v,1)+'</text>';
    o+='<text class="tx" x="'+(bx+w/2)+'" y="'+(H-5)+'" text-anchor="middle">'+parseInt(x.d.slice(8),10)+'</text>';
  });
  if(s.rec>0)o+='<line class="rec" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(s.rec)+'" y2="'+Y(s.rec)+'"/>';
  return o+'</svg>';

var WEATHER_KEY='aotom.weather.location.v1',weatherLocation=null,weatherData=null,weatherBusy=false,weatherError='',weatherFetched=0,weatherEdit=false;
try{weatherLocation=JSON.parse(localStorage.getItem(WEATHER_KEY)||'null');}catch(e){}
weatherEdit=!weatherLocation;
function weatherNumber(v,d){return (v===null||v===undefined||!isFinite(Number(v)))?'—':fmt(Number(v),d);}
function weatherWarnings(data){
  if(!data||!data.hourly)return [];
  var h=data.hourly,now=Date.now(),ids=[];
  (h.time||[]).forEach(function(t,i){var ms=new Date(t).getTime();if(ms>=now-3600000&&ms<=now+12*3600000)ids.push(i);});
  if(!ids.length)ids=(h.time||[]).map(function(_,i){return i;}).slice(0,12);
  function max(k){return Math.max.apply(null,ids.map(function(i){return Number(h[k]&&h[k][i])||0;}));}
  var out=[],rain=max('precipitation'),gust=max('wind_gusts_10m'),prob=max('precipitation_probability');
  if(rain>=10)out.push({level:'bad',title:'Cảnh báo mưa rất lớn',note:'Dự báo có giờ mưa tới '+weatherNumber(rain,1)+' mm trong 12 giờ tới. Theo dõi mực nước, độ mặn và pH.'});
  else if(rain>=5)out.push({level:'warn',title:'Có khả năng mưa lớn',note:'Lượng mưa giờ cao nhất '+weatherNumber(rain,1)+' mm. Kiểm tra ao trước và sau mưa.'});
  if(gust>=60)out.push({level:'bad',title:'Cảnh báo gió giật mạnh',note:'Gió giật dự báo tới '+weatherNumber(gust,0)+' km/h. Kiểm tra điện, quạt và thiết bị ao.'});
  else if(gust>=40)out.push({level:'warn',title:'Dự báo gió mạnh',note:'Gió giật tới '+weatherNumber(gust,0)+' km/h; kiểm tra hệ thống ao.'});
  var temps=ids.map(function(i){return Number(h.temperature_2m&&h.temperature_2m[i]);}).filter(Number.isFinite);
  if(temps.length>1&&Math.max.apply(null,temps)-Math.min.apply(null,temps)>=6)out.push({level:'warn',title:'Nhiệt độ không khí dao động mạnh',note:'Biên độ dự báo '+weatherNumber(Math.max.apply(null,temps)-Math.min.apply(null,temps),1)+'°C trong 12 giờ tới. Theo dõi nhiệt độ nước ao.'});
  if(!out.length&&prob>=80)out.push({level:'warn',title:'Xác suất có mưa cao',note:'Khả năng mưa dự báo tới '+weatherNumber(prob,0)+'% trong 12 giờ tới.'});
  return out;
}

  }else{

function saveWeatherLocation(loc){weatherLocation=loc;weatherData=null;weatherError='';weatherFetched=0;weatherEdit=false;try{localStorage.setItem(WEATHER_KEY,JSON.stringify(loc));}catch(e){}render();fetchWeather(true);}
function fetchWeather(force){
  if(!weatherLocation||weatherBusy||(!force&&weatherFetched&&Date.now()-weatherFetched<30*60000))return;
  weatherBusy=true;weatherError='';
  var loc=weatherLocation;
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(loc.lat)+'&longitude='+encodeURIComponent(loc.lon)+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,cloud_cover,wind_speed_10m,wind_gusts_10m&hourly=temperature_2m,precipitation,precipitation_probability,wind_gusts_10m&forecast_days=2&timezone=auto').then(function(r){if(!r.ok)throw Error('Không thể tải dự báo');return r.json();}).then(function(d){if(loc!==weatherLocation)return;weatherData=d;weatherFetched=Date.now();weatherBusy=false;if(ui.view==='home')render();}).catch(function(){weatherBusy=false;weatherError='Không tải được thời tiết. Kiểm tra kết nối mạng rồi thử lại.';if(ui.view==='home')render();});
}

function logText(e){

    case 'water':var parts=WP.filter(function(p){return e[p.k]!=null;}).map(function(p){return p.l+' '+fmt(e[p.k],p.d)+(p.u?' '+p.u:'');});return {t:parts.join(' · '),s:e.session||''};
    case 'abw':return {t:'Cân mẫu '+fmt(e.g,1)+' g ('+fmt(1000/e.g)+' con/kg)',s:e.surv?'Sống ước tính '+e.surv+'%':''};

function moneyView(){
